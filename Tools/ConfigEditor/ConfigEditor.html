<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColorsAction — редактор конфигов</title>
<style>
  :root {
    --bg: #e9ebee; --panel: #ffffff; --panel2: #f5f6f8; --line: #d9dce1; --line2: #c3c7ce;
    --text: #23262b; --muted: #6b7078; --faint: #9aa0a8;
    --accent: #2F6BFF; --ok: #3DBE5A; --warn: #E8913C; --bad: #E8413C;
    --cube: #c9ccd2; --cube-top: #e3e5e9; --cube-edge: #9ea2aa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg); }
  aside h1 .logo { width: 18px; height: 18px; background: var(--cube); border: 1px solid var(--cube-edge); border-radius: 3px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.08); flex: none; }
  #status { color: var(--muted); font-size: 12px; line-height: 1.35; padding: 0 2px 2px; }
  button, .btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line2); background: var(--panel); color: var(--text); cursor: pointer; white-space: nowrap; }
  button:hover, .btn:hover { background: var(--panel2); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: default; }
  button.small { padding: 2px 8px; font-size: 12px; }
  button.icon { padding: 2px 7px; font-size: 12px; color: var(--muted); }
  button.danger { color: var(--bad); }
  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  aside h1 { font-size: 15px; margin: 0; padding: 14px 16px 10px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  aside .tools { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 7px; }
  aside .tools button, aside .tools .btn { width: 100%; text-align: center; white-space: normal; }
  nav { flex: 1; min-height: 0; padding: 4px 8px 10px; overflow: auto; }
  nav a { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 7px; color: var(--text); text-decoration: none; cursor: pointer; margin-bottom: 2px; }
  nav a small { color: var(--faint); font-size: 11px; display: block; }
  nav a:hover { background: var(--panel2); }
  nav a.active { background: #e4ebff; }
  nav a .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  nav a .err { color: var(--bad); font-weight: 700; flex: none; }
  nav .hint { color: var(--muted); font-size: 12px; padding: 10px; }
  main { padding: 18px 22px 80px; max-width: 1500px; }
  .empty { max-width: 640px; margin: 60px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px 30px; }
  .empty h2 { margin-top: 0; }
  .empty ol { padding-left: 20px; } .empty li { margin: 6px 0; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  .pagehead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .pagehead h2 { margin: 0; font-size: 22px; }
  .pagehead .file { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .pagehead .actions { margin-left: auto; display: flex; gap: 8px; }
  .pagedesc { color: var(--muted); margin: 2px 0 14px; max-width: 900px; }
  .warnings { margin: 0 0 14px; }
  .warnings div { background: #fdecea; color: #a12a25; border: 1px solid #f3c2bf; padding: 6px 10px; border-radius: 7px; margin-bottom: 4px; font-size: 13px; }
  section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; overflow: clip; }
  section.card > h3 { margin: 0; padding: 11px 16px; font-size: 15px; border-bottom: 1px solid var(--line); background: var(--panel2); display: flex; align-items: center; gap: 10px; }
  section.card > h3 .sub { font-weight: 400; color: var(--muted); font-size: 12px; }
  section.card > h3 .right { margin-left: auto; display: flex; gap: 6px; }
  .cardbody { display: grid; grid-template-columns: minmax(540px, 1.1fr) minmax(380px, 1fr); gap: 0; }
  .cardbody.single { grid-template-columns: 1fr; }
  .fields { padding: 6px 16px 12px; }
  .viz { padding: 12px 16px; border-left: 1px solid var(--line); background: #fbfbfc; min-width: 0; }
  .vizin { position: sticky; top: 14px; }
  .viz svg { display: block; max-width: 100%; height: auto; }
  .viz .facts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0 4px; font-size: 12.5px; color: var(--muted); }
  .viz .facts b { color: var(--text); font-weight: 600; }
  .viz h4 { margin: 12px 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .viz h4:first-child { margin-top: 0; }
  .row { display: grid; grid-template-columns: minmax(200px, 1fr) 130px 150px 22px; gap: 4px 12px; align-items: center; padding: 7px 0; border-bottom: 1px dashed #eceef1; }
  .row:last-child { border-bottom: 0; }
  .row .lbl { min-width: 0; }
  .row .lbl .name { font-weight: 560; }
  .row .lbl .key { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--faint); margin-left: 6px; }
  .row .lbl .desc { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .row.changed .lbl .name::after { content: " •"; color: var(--warn); }
  .row.default .ctl input[type=number], .row.default .ctl input[type=text] { color: var(--faint); font-style: italic; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); }
  .row .ctl { display: flex; align-items: center; gap: 6px; }
  .row .ctl input[type=number], .row .ctl input[type=text], .row .ctl select { width: 100%; font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line2); border-radius: 6px; background: #fff; color: var(--text); min-width: 0; }
  .row .ctl input[type=number] { width: 86px; flex: none; text-align: right; }
  .row .ctl .unit { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .row .ctl input[type=color] { width: 36px; height: 28px; padding: 0; border: 1px solid var(--line2); border-radius: 6px; background: none; flex: none; }
  .row .wide { grid-column: 2 / 4; }
  .row .reset { visibility: hidden; border: 0; background: none; color: var(--muted); padding: 0; font-size: 15px; cursor: pointer; }
  .row.changed .reset { visibility: visible; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); vertical-align: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips label { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line2); border-radius: 14px; padding: 2px 9px; font-size: 12px; cursor: pointer; background: #fff; }
  .chips label.on { background: #e4ebff; border-color: #a9c0ff; }
  .chips input { margin: 0; }
  .subhead { margin: 14px 0 2px; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .combo { border: 1px solid var(--line); border-radius: 9px; margin: 8px 0; background: #fcfcfd; }
  .combo .chead { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 13px; }
  .combo .chead .right { margin-left: auto; display: flex; gap: 4px; }
  .combo .fields { padding: 0 10px 4px; }
  .combo .row { grid-template-columns: 1fr 120px 150px 22px; padding: 4px 0; }
  .add { margin: 6px 0; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line2); border-radius: 10px; padding: 0 7px; font-weight: 400; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  table.dmg { border-collapse: collapse; font-size: 12.5px; width: 100%; }
  table.dmg th, table.dmg td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  table.dmg th { color: var(--muted); font-weight: 600; }
  .toast { position: fixed; right: 18px; bottom: 18px; background: #23262b; color: #fff; padding: 9px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 480px; }
  .toast.show { opacity: .95; }
  svg text { font-family: system-ui, "Segoe UI", sans-serif; }
  @media (max-width: 1100px) { .cardbody { grid-template-columns: 1fr; } .viz { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1><span class="logo"></span>ColorsAction · конфиги</h1>
    <nav id="nav"><div class="hint">Откройте папку <code>Assets/StreamingAssets/Configs</code> (или корень проекта).</div></nav>
    <div class="tools">
      <div id="status">Конфиги не открыты</div>
      <button id="btnSaveAll" class="primary" disabled title="Ctrl+S">Сохранить всё</button>
      <button id="btnReopen" style="display:none"></button>
      <button id="btnOpen">Открыть папку Configs</button>
      <label class="btn" title="Без доступа к папке: правки сохранятся скачиванием файлов">Загрузить файлы…<input id="fileInput" type="file" accept=".json" multiple hidden></label>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   ColorsAction — редактор JSON-конфигов.
   Источник данных — Assets/StreamingAssets/Configs/*.json, игра читает их в рантайме.
   Этот файл ничего не хранит сам: открывает папку (File System Access API, Chrome/Edge)
   и пишет правки обратно в те же файлы. Без доступа к папке — сохраняет скачиванием.
   Описания параметров — в SCHEMA ниже. Неописанные ключи показываются как есть.
   ===================================================================== */

const FILE_ORDER = ['Player', 'Camera', 'Items', 'Enemies', 'Combat', 'Colors', 'Inventory', 'Dummy', 'Movement', 'Game'];
const S = { dir: null, files: {}, current: null, levels: [], mode: 'none' };

/* ---------- утилиты ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const r2 = (v, d = 2) => Number.isFinite(v) ? (+v.toFixed(d)).toString() : '—';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = (v, def = 0) => Number.isFinite(+v) && v !== '' && v !== null && v !== undefined ? +v : def;
function getPath(o, p) { for (const k of p) { if (o == null) return undefined; o = o[k]; } return o; }
function setPath(o, p, v) { for (let i = 0; i < p.length - 1; i++) { if (o[p[i]] == null || typeof o[p[i]] !== 'object') o[p[i]] = {}; o = o[p[i]]; } o[p[p.length - 1]] = v; }
function decimals(step) { const s = String(step); return s.includes('.') ? s.split('.')[1].length : 0; }
function roundTo(v, step) { const d = Math.min(6, decimals(step) + 1); return +(+v).toFixed(d); }
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
function colorHex(id) { const c = S.files.Colors?.data?.[id]; return c?.hex || '#9EA0A6'; }
function colorName(id) { const c = S.files.Colors?.data?.[id]; return c?.name || id; }
function itemsData() { return S.files.Items?.data || {}; }

/* ---------- форматирование JSON (как в исходных файлах: короткие объекты в одну строку) ---------- */
function oneLine(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(oneLine).join(', ') + ']';
  const ks = Object.keys(v);
  return ks.length ? '{ ' + ks.map(k => JSON.stringify(k) + ': ' + oneLine(v[k])).join(', ') + ' }' : '{}';
}
function fmt(v, ind = '') {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  const line = oneLine(v);
  const flat = Object.values(v).every(x => x === null || typeof x !== 'object');
  if (ind.length >= 2 && ((flat && line.length <= 100) || (ind.length >= 6 && line.length <= 230))) return line;
  if (Array.isArray(v)) {
    if (!v.length) return '[]';
    if (flat && line.length <= 120) return line;
    return '[\n' + v.map(x => ind + '  ' + fmt(x, ind + '  ')).join(',\n') + '\n' + ind + ']';
  }
  const ks = Object.keys(v);
  if (!ks.length) return '{}';
  return '{\n' + ks.map(k => ind + '  ' + JSON.stringify(k) + ': ' + fmt(v[k], ind + '  ')).join(',\n') + '\n' + ind + '}';
}

/* =====================================================================
   SCHEMA — подписи, единицы и диапазоны. 1 блок = 1 куб = 1 метр в Unity.
   t: num | int | bool | enum | text | color(hex) | colorRef | itemRef | level
   ===================================================================== */
const U = { bl: 'бл', bls: 'бл/с', bls2: 'бл/с²', s: 'с', deg: '°', degs: '°/с', x: '×', frac: 'доля', pts: 'ед.' };

const SCHEMA = {
  Player: {
    title: 'Игрок', desc: 'Движение, прыжок, перекат, выносливость и деформация куба игрока. 1 блок = размер куба = 1 метр.',
    sections: [
      { title: 'Движение', viz: vizSpeed, fields: [
        { k: 'walkSpeed', l: 'Скорость ходьбы', d: 'Сколько блоков проходит куб за секунду шагом.', u: U.bls, min: 0.5, max: 15, step: 0.1 },
        { k: 'runMultiplier', l: 'Множитель бега', d: 'Бег (LShift / L3) = ходьба × это число.', u: U.x, min: 1, max: 3, step: 0.05 },
        { k: 'runToggle', l: 'Бег переключателем', t: 'bool', def: true, d: 'Кнопка бега включает и выключает бег; остановка персонажа его сбрасывает. Выключено — бег, пока кнопка зажата.' },
        { k: 'acceleration', l: 'Разгон', d: 'Как быстро набирается скорость. Больше — резче старт.', u: U.bls2, min: 5, max: 300, step: 1 },
        { k: 'deceleration', l: 'Торможение', d: 'Как быстро куб останавливается, когда отпустили стик.', u: U.bls2, min: 5, max: 300, step: 1 },
        { k: 'airControl', l: 'Управление в воздухе', d: 'Доля разгона, доступная в прыжке (0 — траектория не меняется, 1 — как на земле).', u: U.frac, min: 0, max: 1, step: 0.05 },
        { k: 'turnSpeed', l: 'Скорость поворота', d: 'Сколько градусов в секунду куб поворачивается к направлению движения.', u: U.degs, min: 90, max: 2000, step: 10 },
        { k: 'blockMoveMultiplier', l: 'Скорость при блоке', d: 'Множитель скорости, пока поднят щит.', u: U.x, min: 0, max: 1, step: 0.05 },
        { k: 'attackMoveMultiplier', l: 'Скорость при атаке', d: 'Множитель скорости во время удара.', u: U.x, min: 0, max: 1, step: 0.05 },
      ] },
      { title: 'Тело и взаимодействие', viz: vizBody, fields: [
        { k: 'colliderWidth', l: 'Ширина коллайдера', d: 'Ширина капсулы столкновений. Чуть меньше 1, чтобы куб проходил в проёмы шириной 1 блок.', u: U.bl, min: 0.4, max: 1, step: 0.01 },
        { k: 'colliderHeight', l: 'Высота коллайдера', d: 'Высота куба для столкновений.', u: U.bl, min: 0.4, max: 2, step: 0.01 },
        { k: 'stepHeight', l: 'Высота шага', d: 'Перепад, который куб проходит без прыжка. Должна быть меньше высоты коллайдера.', u: U.bl, min: 0, max: 0.9, step: 0.01 },
        { k: 'interactRadius', l: 'Радиус взаимодействия', d: 'На каком расстоянии можно подобрать предмет или нажать рычаг.', u: U.bl, min: 0.3, max: 5, step: 0.1 },
      ] },
      { title: 'Прыжок', viz: vizJump, fields: [
        { k: 'jumpHeight', l: 'Высота прыжка', d: 'На сколько блоков поднимается низ куба. Уступ этой высоты — запрыгивается.', u: U.bl, min: 0, max: 4, step: 0.05 },
        { k: 'jumpWindup', l: 'Замах перед прыжком', d: 'Пауза на сжатие куба перед отрывом от земли.', u: U.s, min: 0, max: 0.3, step: 0.01 },
        { k: 'gravity', l: 'Гравитация', d: 'Ускорение падения на подъёме. Больше — прыжок короче и резче (высота не меняется).', u: U.bls2, min: 5, max: 100, step: 0.5 },
        { k: 'fallGravityMultiplier', l: 'Гравитация на спуске', d: 'Множитель гравитации после верхней точки: спуск быстрее подъёма.', u: U.x, min: 1, max: 4, step: 0.05 },
        { k: 'maxFallSpeed', l: 'Предел скорости падения', d: 'Быстрее этого куб не падает.', u: U.bls, min: 5, max: 60, step: 0.5 },
        { k: 'coyoteTime', l: 'Время «койота»', d: 'Сколько ещё можно прыгнуть после того, как куб сошёл с края.', u: U.s, min: 0, max: 0.3, step: 0.01 },
        { k: 'jumpBuffer', l: 'Буфер прыжка', d: 'Нажатие прыжка чуть раньше приземления запомнится на это время.', u: U.s, min: 0, max: 0.3, step: 0.01 },
      ] },
      { title: 'Перекат', viz: vizRoll, fields: [
        { k: 'rollDistance', l: 'Длина переката', d: 'Сколько блоков куб проходит за весь перекат (два переворота).', u: U.bl, min: 0, max: 8, step: 0.1 },
        { k: 'rollDuration', l: 'Длительность', d: 'Время всего переката от старта до приземления «на ноги».', u: U.s, min: 0.1, max: 1.5, step: 0.01 },
        { k: 'rollCooldown', l: 'Перезарядка', d: 'Пауза после переката, прежде чем можно сделать следующий.', u: U.s, min: 0, max: 1, step: 0.01 },
        { k: 'rollHopHeight', l: 'Высота подскока', d: 'Насколько куб подпрыгивает в каждом из двух переворотов.', u: U.bl, min: 0, max: 1.5, step: 0.01 },
        { k: 'rollInvulnerableFrom', l: 'Неуязвимость с', d: 'Начало окна неуязвимости, доля длительности переката (0..1).', u: U.frac, min: 0, max: 1, step: 0.01 },
        { k: 'rollInvulnerableTo', l: 'Неуязвимость до', d: 'Конец окна неуязвимости, доля длительности (0..1).', u: U.frac, min: 0, max: 1, step: 0.01 },
        { k: 'rollMidPause', l: 'Пауза «на голове»', d: 'Доля длительности, которую куб стоит вверх дном между переворотами (0..0.6).', u: U.frac, min: 0, max: 0.6, step: 0.01 },
        { k: 'rollMidSpeed', l: 'Скольжение в паузе', d: 'Скорость в паузе относительно скорости в полёте (0 — стоит на месте).', u: U.x, min: 0, max: 1, step: 0.05 },
      ] },
      { title: 'Выносливость', viz: vizStamina, fields: [
        { k: 'stamina.max', l: 'Запас', d: 'Полная шкала выносливости.', u: U.pts, min: 10, max: 300, step: 1 },
        { k: 'stamina.regenPerSecond', l: 'Восстановление', d: 'Сколько единиц восстанавливается в секунду.', u: 'ед./с', min: 1, max: 200, step: 1 },
        { k: 'stamina.regenDelay', l: 'Задержка восстановления', d: 'Через сколько секунд после траты начинается восстановление.', u: U.s, min: 0, max: 3, step: 0.05 },
        { k: 'stamina.rollCost', l: 'Цена переката', d: '', u: U.pts, min: 0, max: 100, step: 1 },
        { k: 'stamina.blockStartCost', l: 'Цена поднятия щита', d: 'Списывается в момент начала блока.', u: U.pts, min: 0, max: 50, step: 1 },
        { k: 'stamina.blockRegenMultiplier', l: 'Восстановление при блоке', d: 'Множитель восстановления, пока щит поднят.', u: U.x, min: 0, max: 1, step: 0.05 },
        { k: 'stamina.jumpCost', l: 'Цена прыжка', d: '0 — прыжок бесплатный.', u: U.pts, min: 0, max: 50, step: 1 },

const IDB = {
  db() { return new Promise((res, rej) => { const r = indexedDB.open('colorsaction-config-editor', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { const db = await this.db(); return new Promise(res => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); }); },
  async set(k, v) { const db = await this.db(); return new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); }); },
};

function addFile(name, text, handle) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast(`${name}.json: ошибка JSON — ${e.message}`, 6000); return; }
  S.files[name] = { data, orig: clone(data), saved: fmt(data), handle: handle || null, eol: text.includes('\r\n') ? '\r\n' : '\n' };
}

async function openDir(dir) {
  // Если выбрали корень проекта — спускаемся в Assets/StreamingAssets/Configs.
  for (const p of ['Assets', 'StreamingAssets', 'Configs']) {
    try { dir = await dir.getDirectoryHandle(p); } catch { /* нет такой папки — остаёмся */ }
  }
  S.files = {}; S.levels = []; S.dir = dir; S.mode = 'dir';
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'file' && name.toLowerCase().endsWith('.json')) {
      const f = await h.getFile();
      addFile(name.replace(/\.json$/i, ''), await f.text(), h);
    } else if (h.kind === 'directory' && /levels/i.test(name)) {
      for await (const [ln, lh] of h.entries()) if (lh.kind === 'file' && ln.endsWith('.json')) S.levels.push(`${name}/${ln.replace(/\.json$/, '')}`);
    }
  }
  if (!Object.keys(S.files).length) { toast(`В папке «${dir.name}» нет .json — выберите Assets/StreamingAssets/Configs.`, 6000); S.dir = null; S.mode = 'none'; renderAll(); return; }
  await IDB.set('dir', dir);
  S.current = S.files[S.current] ? S.current : firstFile();
  renderAll();
  toast(`Открыто: ${Object.keys(S.files).length} конфигов из «${dir.name}». Правки пишутся прямо в файлы.`);
}

async function pickDir() {
  if (!window.showDirectoryPicker) { toast('Браузер не умеет писать в папки (нужен Chrome или Edge). Используйте «Загрузить файлы…» — сохранение будет скачиванием.', 7000); return; }
  try { const d = await showDirectoryPicker({ id: 'colorsaction-configs', mode: 'readwrite' }); await openDir(d); }
  catch (e) { if (e.name !== 'AbortError') toast('Не удалось открыть папку: ' + e.message, 6000); }
}

async function ensureWrite(handle) {
  const o = { mode: 'readwrite' };
  if (await handle.queryPermission(o) === 'granted') return true;
  return await handle.requestPermission(o) === 'granted';
}

async function saveFile(name) {
  const f = S.files[name]; if (!f) return false;
  const text = fmt(f.data).replace(/\n/g, f.eol) + f.eol;
  try {
    if (f.handle) {
      if (!(await ensureWrite(S.dir || f.handle))) { toast('Нет разрешения на запись.'); return false; }
      const w = await f.handle.createWritable(); await w.write(text); await w.close();
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.download = name + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }
  } catch (e) { toast(`Не удалось сохранить ${name}.json: ${e.message}`, 6000); return false; }
  f.saved = fmt(f.data); f.orig = clone(f.data);
  return true;
}
async function saveAll() {
  const dirty = Object.keys(S.files).filter(isDirty);
  if (!dirty.length) { toast('Нет несохранённых правок.'); return; }
  let ok = 0; for (const n of dirty) if (await saveFile(n)) ok++;
  renderNav(); renderPage();
  toast(S.mode === 'dir' ? `Сохранено файлов: ${ok}. Unity подхватит их при следующем запуске Play.` : `Скачано файлов: ${ok}. Положите их в Assets/StreamingAssets/Configs.`);
}

const isDirty = n => S.files[n] && fmt(S.files[n].data) !== S.files[n].saved;
function firstFile() { return FILE_ORDER.find(n => S.files[n]) || Object.keys(S.files)[0]; }
function warningsFor(n) { const f = S.files[n]; const sc = SCHEMA[n]; return f && sc?.validate ? sc.validate(f.data) : (n === 'Items' ? validateItems(f.data) : n === 'Enemies' ? validateEnemies(f.data) : []); }

/* =====================================================================
   Рендер: навигация и страница
   ===================================================================== */
function renderAll() { renderHeader(); renderNav(); renderPage(); }

function renderHeader() {
  const n = Object.keys(S.files).length;
  $('#status').textContent = !n ? 'Конфиги не открыты'
    : S.mode === 'dir' ? `Папка «${S.dir.name}» · ${n} файлов · сохранение прямо в файлы`
    : S.mode === 'fetch' ? `Только просмотр (${n} файлов с сервера) · сохранение скачиванием, или откройте папку для записи`
    : `${n} файлов загружено · сохранение скачиванием`;
  $('#btnSaveAll').disabled = !n || !Object.keys(S.files).some(isDirty);
}

function renderNav() {
  const nav = $('#nav');
  const names = Object.keys(S.files);
  if (!names.length) { nav.innerHTML = '<div class="hint">Откройте папку <code>Assets/StreamingAssets/Configs</code> (или корень проекта).</div>'; return; }
  const order = [...FILE_ORDER.filter(n => S.files[n]), ...names.filter(n => !FILE_ORDER.includes(n)).sort()];
  nav.innerHTML = order.map(n => {
    const t = SCHEMA[n]?.title || ({ Items: 'Оружие и предметы', Enemies: 'Враги', Colors: 'Цвета', Movement: 'Профили передвижения' })[n] || n;
    const w = warningsFor(n).length;
    return `<a data-f="${esc(n)}" class="${n === S.current ? 'active' : ''}"><span>${esc(t)}<small>${esc(n)}.json</small></span>${w ? `<span class="err" title="Есть ошибки">!</span>` : isDirty(n) ? '<span class="dot" title="Есть несохранённые правки"></span>' : ''}</a>`;
  }).join('');
  nav.querySelectorAll('a').forEach(a => a.onclick = () => { S.current = a.dataset.f; renderNav(); renderPage(); window.scrollTo(0, 0); });
  renderHeader();
}

let VIZ = []; // { el, fn, ctx }
function refresh() {
  for (const v of VIZ) { try { v.el.innerHTML = v.fn(v.ctx()); } catch (e) { v.el.innerHTML = `<div style="color:var(--bad)">Ошибка визуализации: ${esc(e.message)}</div>`; } }
  const w = $('#warnings'); if (w) w.innerHTML = warningsFor(S.current).map(x => `<div>⚠ ${esc(x)}</div>`).join('');
  renderNav();
}

function renderPage() {
  const main = $('#main'); VIZ = [];
  const n = S.current; const f = S.files[n];
  if (!f) { main.innerHTML = emptyHtml(); return; }
  const sc = SCHEMA[n];
  main.innerHTML = '';
  const head = el(`<div class="pagehead"><h2>${esc(sc?.title || ({ Items: 'Оружие и предметы', Enemies: 'Враги', Colors: 'Цвета', Movement: 'Профили передвижения' })[n] || n)}</h2>
    <span class="file">Assets/StreamingAssets/Configs/${esc(n)}.json</span>
    <span class="actions"><button id="btnRevert">Отменить правки</button><button class="primary" id="btnSave">${S.mode === 'dir' ? 'Сохранить' : 'Скачать'} ${esc(n)}.json</button></span></div>`);
  main.append(head);
  main.append(el(`<div class="pagedesc">${esc(sc?.desc || PAGE_DESC[n] || 'Описания для этого файла нет — ключи показаны как есть.')}</div>`));
  main.append(el('<div class="warnings" id="warnings"></div>'));
  $('#btnSave').onclick = async () => { if (await saveFile(n)) { toast(S.mode === 'dir' ? `${n}.json сохранён.` : `${n}.json скачан.`); renderPage(); renderNav(); } };
  $('#btnRevert').onclick = () => { f.data = clone(f.orig); renderPage(); refresh(); };

  if (n === 'Items') renderItems(main, f);
  else if (n === 'Colors') renderColors(main, f);
  else if (n === 'Movement') renderMovement(main, f);
  else if (n === 'Enemies') renderEnemies(main, f);
  else if (sc) {
    const used = new Set();
    for (const s of sc.sections) {
      const card = sectionCard(s.title, s.sub, !!s.viz);
      for (const fd of s.fields) { used.add(fd.k.split('.')[0] === fd.k ? fd.k : fd.k); card.fields.append(fieldRow(f, fd.k.split('.'), fd)); }
      if (s.viz) addViz(card.viz, s.viz, () => ({ d: f.data, f }));
      main.append(card.root);
    }
    const leftovers = collectUnknown(f.data, sc.sections.flatMap(s => s.fields.map(x => x.k)));
    if (leftovers.length) {
      const card = sectionCard('Прочие ключи', 'без описания', false);
      for (const p of leftovers) card.fields.append(genericRow(f, p));
      main.append(card.root);
    }
  } else {
    const card = sectionCard('Ключи', 'без описания', false);
    for (const p of collectUnknown(f.data, [])) card.fields.append(genericRow(f, p));
    main.append(card.root);
  }
  refresh();
}

const PAGE_DESC = {
  Items: 'Оружие и предметы. Ключ (id) используется в коде, инвентаре и Combat.unarmedItem. У оружия — серия ударов (комбо): каждое нажатие атаки в окне комбо запускает следующий удар.',
  Colors: 'Палитра: id цвета → название и HEX. Цвета оружия, врагов и стен ссылаются на эти id.',
  Enemies: 'Типы врагов: внешний вид, поведение (агро, погоня, очередь атак) и одиночные атаки с долгим читаемым замахом. Id типа используется в уровнях при расстановке врагов.',
  Movement: 'Профили передвижения для поиска пути в редакторе уровней: что персонаж проходит шагом, прыжком и спрыгиванием, какими особыми связями пользуется.',
};

function emptyHtml() {
  return `<div class="empty"><h2>Редактор конфигов ColorsAction</h2>
  <p>Игра читает параметры из JSON в <code>Assets/StreamingAssets/Configs</code>. Здесь их удобно смотреть и крутить: подписи, единицы, слайдеры и наглядные схемы.</p>
  <ol>
    <li>Нажмите <b>«Открыть папку Configs»</b> и выберите <code>Assets/StreamingAssets/Configs</code> (можно корень проекта — папка найдётся сама). Браузер спросит разрешение на изменение файлов.</li>
    <li>Меняйте значения — схемы справа обновляются сразу. Изменённые параметры помечены точкой, ↺ возвращает прежнее значение.</li>
    <li><b>Сохранить</b> (или Ctrl+S) пишет JSON обратно в те же файлы. Unity подхватит их при следующем запуске Play.</li>
  </ol>
  <p style="color:var(--muted)">Запись в папку работает в Chrome и Edge. В других браузерах используйте «Загрузить файлы…» — тогда изменённые файлы будут скачиваться, и их нужно положить на место вручную.</p></div>`;
}

function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function sectionCard(title, sub, withViz) {
  const root = el(`<section class="card"><h3>${esc(title)}${sub ? ` <span class="sub">${esc(sub)}</span>` : ''}<span class="right"></span></h3><div class="cardbody ${withViz ? '' : 'single'}"><div class="fields"></div>${withViz ? '<div class="viz"><div class="vizin"></div></div>' : ''}</div></section>`);
  return { root, fields: $('.fields', root), viz: $('.vizin', root), right: $('h3 .right', root) };
}
function addViz(container, fn, ctx) { VIZ.push({ el: container, fn, ctx }); }

function collectUnknown(data, knownKeys, prefix = []) {
  const known = new Set(knownKeys);
  const out = [];
  for (const k of Object.keys(data || {})) {
    const p = [...prefix, k]; const pk = p.join('.');
    if (known.has(pk)) continue;
    const v = data[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && [...known].some(x => x.startsWith(pk + '.'))) out.push(...collectUnknown(v, knownKeys, p));
    else out.push(p);
  }
  return out;
}

/* ---------- строка параметра ---------- */
function fieldRow(f, path, fd, onChange) {
  const t = fd.t || 'num';
  let v = getPath(f.data, path);
  const isDef = v === undefined;
  if (isDef) v = fd.def;
  const origV = getPath(f.orig, path);
  const row = el(`<div class="row"><div class="lbl"><span class="name">${esc(fd.l)}</span><span class="key">${esc(path[path.length - 1])}</span>${fd.d ? `<div class="desc">${esc(fd.d)}</div>` : ''}</div></div>`);
  const mark = () => {
    const cur = getPath(f.data, path);
    row.classList.toggle('changed', JSON.stringify(cur) !== JSON.stringify(origV));
    row.classList.toggle('default', cur === undefined);
  };
  const commit = val => { setPath(f.data, path, val); mark(); onChange?.(val); refresh(); };
  let ctl;
  if (t === 'num' || t === 'int') {
    const step = fd.step ?? (t === 'int' ? 1 : 0.01);
    const range = el(`<input type="range" min="${fd.min ?? 0}" max="${fd.max ?? Math.max(1, Math.abs(num(v)) * 3)}" step="${step}">`);
    const box = el(`<div class="ctl"><input type="number" step="${step}"><span class="unit">${esc(fd.u || '')}</span></div>`);
    const nb = $('input', box);
    range.value = num(v); nb.value = v ?? '';
    range.oninput = () => { const x = t === 'int' ? Math.round(+range.value) : roundTo(range.value, step); nb.value = x; commit(x); };
    nb.oninput = () => { if (nb.value === '' || !Number.isFinite(+nb.value)) return; const x = t === 'int' ? Math.round(+nb.value) : +nb.value; range.value = x; commit(x); };
    row.append(range, box);
    ctl = { set: x => { range.value = num(x); nb.value = x ?? ''; } };
  } else if (t === 'bool') {
    const box = el(`<div class="ctl wide"><label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox"> <span></span></label></div>`);
    const cb = $('input', box); const sp = $('span', box);
    const upd = () => sp.textContent = cb.checked ? 'да' : 'нет';
    cb.checked = !!v; upd(); cb.onchange = () => { upd(); commit(cb.checked); };
    row.append(box); ctl = { set: x => { cb.checked = !!x; upd(); } };
  } else if (t === 'enum' || t === 'colorRef' || t === 'itemRef') {
    let opts = fd.opts;
    if (t === 'colorRef') opts = Object.entries(S.files.Colors?.data || {}).map(([id, c]) => [id, `${c.name || id} (${id})`]);
    if (t === 'itemRef') opts = Object.entries(itemsData()).map(([id, c]) => [id, `${c.name || id} (${id})`]);
    if (v !== undefined && v !== null && !opts.some(o => o[0] === v)) opts = [[v, `${v} — нет в списке`], ...opts];
    const box = el(`<div class="ctl wide">${t === 'colorRef' ? '<span class="swatch"></span>' : ''}<select>${opts.map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select></div>`);
    const s = $('select', box); s.value = v ?? '';
    const sw = $('.swatch', box); const updSw = () => sw && (sw.style.background = colorHex(s.value)); updSw();
    s.onchange = () => { updSw(); commit(s.value); };
    row.append(box); ctl = { set: x => { s.value = x ?? ''; updSw(); } };
  } else if (t === 'color') {
    const box = el(`<div class="ctl wide"><input type="color"><input type="text" style="width:100px;flex:none;font-family:ui-monospace,Consolas,monospace"></div>`);
    const [cp, tx] = box.querySelectorAll('input');
    const norm = x => /^#[0-9a-f]{6}$/i.test(x || '') ? x : '#000000';
    cp.value = norm(v); tx.value = v ?? '';
    cp.oninput = () => { tx.value = cp.value.toUpperCase(); commit(tx.value); };
    tx.oninput = () => { if (/^#[0-9a-f]{6}$/i.test(tx.value)) { cp.value = tx.value; commit(tx.value.toUpperCase()); } };
    row.append(box); ctl = { set: x => { cp.value = norm(x); tx.value = x ?? ''; } };
  } else { // text, level
    const id = 'dl' + Math.random().toString(36).slice(2);
    const box = el(`<div class="ctl wide"><input type="text" ${t === 'level' ? `list="${id}"` : ''}>${t === 'level' ? `<datalist id="${id}">${S.levels.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}</div>`);
    const tx = $('input', box); tx.value = v ?? '';
    tx.oninput = () => commit(tx.value);
    row.append(box); ctl = { set: x => { tx.value = x ?? ''; } };
  }
  const reset = el('<button class="reset" title="Вернуть сохранённое значение">↺</button>');
  reset.onclick = () => {
    if (origV === undefined) { const parent = getPath(f.data, path.slice(0, -1)); if (parent) delete parent[path[path.length - 1]]; ctl.set(fd.def); }
    else { setPath(f.data, path, clone(origV)); ctl.set(origV); }
    mark(); onChange?.(origV); refresh();
  };
  row.append(reset);
  mark();
  return row;
}

function genericRow(f, path) {
  const v = getPath(f.data, path);
  const label = path.join('.');
  if (typeof v === 'number') return fieldRow(f, path, { l: label, min: Math.min(0, v * 3), max: Math.max(1, Math.abs(v) * 3), step: Number.isInteger(v) ? 1 : 0.01 });
  if (typeof v === 'boolean') return fieldRow(f, path, { l: label, t: 'bool' });
  if (typeof v === 'string') return /^#[0-9a-f]{6}$/i.test(v) ? fieldRow(f, path, { l: label, t: 'color' }) : fieldRow(f, path, { l: label, t: 'text' });
  // объект / массив — как JSON
  const row = el(`<div class="row"><div class="lbl"><span class="name">${esc(label)}</span><div class="desc">JSON</div></div><div class="ctl wide"><textarea rows="3" style="width:100%;font-family:ui-monospace,Consolas,monospace;font-size:12px"></textarea></div><span></span></div>`);
  const ta = $('textarea', row); ta.value = JSON.stringify(v, null, 1);
  ta.oninput = () => { try { setPath(f.data, path, JSON.parse(ta.value)); ta.style.borderColor = ''; refresh(); } catch { ta.style.borderColor = 'var(--bad)'; } };
  return row;
}

/* ---------- Items ---------- */
function validateItems(d) {
  const w = [];
  for (const [id, it] of Object.entries(d || {})) {
    const weapon = it.kind === 'OneHanded' || it.kind === 'TwoHanded';
    if (weapon && !(it.combo?.length)) w.push(`${id}: у оружия должна быть хотя бы одна атака в серии.`);
    if (it.color && S.files.Colors && !S.files.Colors.data[it.color]) w.push(`${id}: цвета «${it.color}» нет в Colors.json.`);
    (it.combo || []).forEach((s, i) => {
      if (s.windup === undefined && num(s.activeFrom, 0.3) > num(s.activeTo, 0.65)) w.push(`${id}, удар ${i + 1}: «попадание с» позже, чем «попадание до».`);
      if (s.strike !== undefined && num(s.strike, 0.08) <= 0) w.push(`${id}, удар ${i + 1}: у удара должна быть ненулевая длительность.`);
    });
  }
  return w;
}

function renderItems(main, f) {
  const bar = el('<div style="margin:-4px 0 14px;display:flex;gap:8px"><button id="addItem">+ Новый предмет</button></div>');
  main.append(bar);
  $('#addItem', bar).onclick = () => {
    const id = prompt('Id нового предмета (латиница, например spear):'); if (!id) return;
    if (f.data[id]) { toast('Такой id уже есть.'); return; }
    f.data[id] = { name: id, color: 'none', kind: 'OneHanded', hand: 'Any', damage: 10, prefab: '', comboWindow: 0.35, combo: [{ motion: 'SlashRight', windup: 0.18, strike: 0.08, hold: 0.22, recovery: 0.14, damageMultiplier: 1, lunge: 0.25, range: 1.3, arc: 150, knockback: 1, staminaCost: 12 }] };
    renderPage();
  };
  for (const id of Object.keys(f.data)) {
    const it = f.data[id];
    const card = sectionCard('', '', true);
    const h3 = $('h3', card.root);
    h3.innerHTML = `<span class="swatch" style="width:16px;height:16px;background:${esc(colorHex(it.color))}"></span>${esc(it.name || id)} <span class="tag">${esc(id)}</span><span class="right"></span>`;
    const right = $('.right', h3);
    const bRen = el('<button class="small">Переименовать id</button>');
    const bDup = el('<button class="small">Копия</button>');
    const bDel = el('<button class="small danger">Удалить</button>');
    right.append(bRen, bDup, bDel);
    bRen.onclick = () => { const nid = prompt('Новый id:', id); if (!nid || nid === id) return; if (f.data[nid]) return toast('Такой id уже есть.'); f.data = renameKey(f.data, id, nid); renderPage(); };
    bDup.onclick = () => { let nid = id + '_copy'; while (f.data[nid]) nid += '_'; f.data = insertAfter(f.data, id, nid, clone(it)); renderPage(); };
    bDel.onclick = () => { if (confirm(`Удалить предмет «${it.name || id}»?`)) { delete f.data[id]; renderPage(); } };

    const isShield = it.kind === 'Shield';
    for (const fd of ITEM_FIELDS) {
      if (fd.onlyShield && !isShield) continue;
      if (fd.onlyWeapon && (isShield || it.kind === 'Consumable')) continue;
      card.fields.append(fieldRow(f, [id, fd.k], fd, () => { if (fd.k === 'kind' || fd.k === 'color' || fd.k === 'name') renderPage(); }));
    }
    const leftovers = collectUnknown(it, [...ITEM_FIELDS.map(x => x.k), 'combo']);
    for (const p of leftovers) card.fields.append(genericRow(f, [id, ...p]));

    if (!isShield && it.kind !== 'Consumable' || it.combo?.length) {
      const sh = el(`<div class="subhead">Серия ударов (комбо) <button class="small">+ удар</button></div>`);
      card.fields.append(sh);
      $('button', sh).onclick = () => { it.combo = it.combo || []; it.combo.push(clone(it.combo[it.combo.length - 1] || Object.fromEntries(STEP_FIELDS.map(x => [x.k, x.def])))); renderPage(); };
      (it.combo || []).forEach((step, i) => {
        const box = el(`<div class="combo"><div class="chead">Удар ${i + 1}<span class="right"></span></div><div class="fields"></div></div>`);
        const r = $('.right', box);
        const up = el('<button class="icon" title="Выше">↑</button>'), dn = el('<button class="icon" title="Ниже">↓</button>'), cp = el('<button class="icon" title="Копия">⧉</button>'), rm = el('<button class="icon danger" title="Удалить">✕</button>');
        r.append(up, dn, cp, rm);
        up.disabled = i === 0; dn.disabled = i === it.combo.length - 1;
        up.onclick = () => { [it.combo[i - 1], it.combo[i]] = [it.combo[i], it.combo[i - 1]]; renderPage(); };
        dn.onclick = () => { [it.combo[i + 1], it.combo[i]] = [it.combo[i], it.combo[i + 1]]; renderPage(); };
        cp.onclick = () => { it.combo.splice(i + 1, 0, clone(step)); renderPage(); };
        rm.onclick = () => { it.combo.splice(i, 1); renderPage(); };
        const fl = $('.fields', box);

/* =====================================================================
   Визуализации (SVG). Сцена «сбоку»: ось X — блоки вперёд, ось Y — высота.
   ===================================================================== */
const C = { grid: '#e3e5e9', grid2: '#cfd3d9', ground: '#c9ccd2', groundTop: '#b7bbc2', text: '#6b7078', dark: '#23262b', blue: '#2F6BFF', red: '#E8413C', green: '#3DBE5A', orange: '#FF8A1F', lilac: '#B07CFF', yellow: '#F5C518', teal: '#18B5A8' };
function svgWrap(w, h, inner) { return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`; }
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.size || 11}" fill="${o.fill || C.text}" text-anchor="${o.anchor || 'start'}" ${o.weight ? `font-weight="${o.weight}"` : ''}>${esc(s)}</text>`;
const facts = arr => `<div class="facts">${arr.map(([k, v]) => `<span>${esc(k)}: <b>${esc(v)}</b></span>`).join('')}</div>`;

// Сторона-сцена: возвращает функции преобразования координат
function scene(w, h, xMin, xMax, yMin, yMax, pad = { l: 30, r: 12, t: 12, b: 22 }) {
  const sx = (w - pad.l - pad.r) / (xMax - xMin), sy = (h - pad.t - pad.b) / (yMax - yMin);
  const s = Math.min(sx, sy);
  const X = x => pad.l + (x - xMin) * s, Y = y => h - pad.b - (y - yMin) * s;
  let g = '';
  for (let y = Math.ceil(yMin * 4) / 4; y <= yMax + 1e-6; y += 0.25) {
    const major = Math.abs(y - Math.round(y)) < 1e-6;
    g += `<line x1="${X(xMin)}" x2="${X(xMax)}" y1="${Y(y)}" y2="${Y(y)}" stroke="${major ? C.grid2 : C.grid}" stroke-width="${major ? 1 : 0.6}"/>`;
    if (major) g += T(pad.l - 5, Y(y) + 4, String(Math.round(y)), { anchor: 'end', size: 10 });
  }
  for (let x = Math.ceil(xMin); x <= xMax + 1e-6; x++) {
    g += `<line x1="${X(x)}" x2="${X(x)}" y1="${Y(yMin)}" y2="${Y(yMax)}" stroke="${C.grid}" stroke-width="0.6"/>`;
    if (x % (s < 18 ? 5 : s < 30 ? 2 : 1) === 0) g += T(X(x), h - pad.b + 13, String(x), { anchor: 'middle', size: 10 });
  }
  return { X, Y, s, g };
}
function cubes(sc, x0, x1, y0, y1, fill = C.ground) {
  let o = '';
  for (let x = Math.floor(x0); x < x1 - 1e-6; x++) for (let y = Math.floor(y0); y < y1 - 1e-6; y++) {
    const w = Math.min(1, x1 - x), hh = Math.min(1, y1 - y);
    o += `<rect x="${sc.X(x)}" y="${sc.Y(y + hh)}" width="${w * sc.s}" height="${hh * sc.s}" fill="${fill}" stroke="#fff" stroke-width="1"/>`;
  }
  return o;
}
function playerCube(sc, cx, by, w = 1, h = 1, o = {}) {
  const x = sc.X(cx - w / 2), y = sc.Y(by + h);
  return `<rect x="${x}" y="${y}" width="${w * sc.s}" height="${h * sc.s}" rx="${sc.s * 0.08}" fill="${o.fill || '#b3b6bd'}" stroke="${o.stroke || '#7d818a'}" stroke-width="1.2" opacity="${o.op ?? 1}" ${o.dash ? 'stroke-dasharray="3 2"' : ''}/>`
    + (o.foot ? `<rect x="${x}" y="${o.footTop ? y : y + h * sc.s - 3}" width="${w * sc.s}" height="3" fill="${o.foot}" opacity="${o.op ?? 1}"/>` : '');
}
// мини-график значений во времени
function chart(w, h, series, o = {}) {
  const pad = { l: 34, r: 10, t: 10, b: 22 };
  const xs = series.flatMap(s => s.pts.map(p => p[0])), ys = series.flatMap(s => s.pts.map(p => p[1]));
  const x0 = o.x0 ?? Math.min(...xs), x1 = o.x1 ?? Math.max(...xs);
  let y0 = o.y0 ?? Math.min(0, ...ys), y1 = o.y1 ?? Math.max(...ys);
  if (y1 - y0 < 1e-6) y1 = y0 + 1;
  const X = x => pad.l + (x - x0) / (x1 - x0) * (w - pad.l - pad.r), Y = y => h - pad.b - (y - y0) / (y1 - y0) * (h - pad.t - pad.b);
  let g = `<rect x="${pad.l}" y="${pad.t}" width="${w - pad.l - pad.r}" height="${h - pad.t - pad.b}" fill="#fff" stroke="${C.grid2}"/>`;
  const ticks = (a, b, n) => { const st = niceStep((b - a) / n); const r = []; for (let v = Math.ceil(a / st) * st; v <= b + 1e-9; v += st) r.push(+v.toFixed(6)); return r; };
  for (const v of ticks(y0, y1, 4)) g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C.grid}"/>` + T(pad.l - 4, Y(v) + 3.5, r2(v), { anchor: 'end', size: 10 });
  for (const v of ticks(x0, x1, 6)) g += T(X(v), h - pad.b + 13, r2(v), { anchor: 'middle', size: 10 });
  if (o.xl) g += T(w - pad.r, h - 1, o.xl, { anchor: 'end', size: 10 });
  if (y0 < 0 && y1 > 0) g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="${C.grid2}" stroke-width="1.2"/>`;
  for (const m of o.marks || []) g += `<line x1="${X(m.x)}" x2="${X(m.x)}" y1="${pad.t}" y2="${h - pad.b}" stroke="${m.c || C.grid2}" stroke-dasharray="3 3"/>` + (m.l ? T(X(m.x) + 3, pad.t + 11, m.l, { size: 10 }) : '');
  for (const s of series) g += `<polyline fill="none" stroke="${s.c}" stroke-width="${s.w || 2}" ${s.dash ? 'stroke-dasharray="5 4"' : ''} points="${s.pts.map(p => `${X(p[0]).toFixed(1)},${Y(clamp(p[1], y0, y1)).toFixed(1)}`).join(' ')}"/>`;
  return svgWrap(w, h, g) + (o.legend ? `<div class="legend">${series.filter(s => s.name).map(s => `<span><i style="background:${s.c}"></i>${esc(s.name)}</span>`).join('')}</div>` : '');
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const m = x / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; }

/* ---------- физика прыжка ---------- */
function jumpModel(d) {
  const g = Math.max(0.01, num(d.gravity, 30)), h = Math.max(0, num(d.jumpHeight)), fm = Math.max(0.01, num(d.fallGravityMultiplier, 1)), vmax = Math.max(0.01, num(d.maxFallSpeed, 25));
  const v0 = Math.sqrt(2 * g * h), tUp = v0 / g, gf = g * fm;
  const fall = drop => { const tc = vmax / gf, dc = vmax * vmax / (2 * gf); return drop <= dc ? Math.sqrt(2 * drop / gf) : tc + (drop - dc) / vmax; };
  const tDown = fall(h);
  const y = t => t <= tUp ? v0 * t - g * t * t / 2 : (() => { const u = t - tUp, tc = vmax / gf; const dy = u <= tc ? gf * u * u / 2 : vmax * vmax / (2 * gf) + vmax * (u - tc); return h - dy; })();
  const landV = Math.min(vmax, gf * Math.min(tDown, vmax / gf));
  return { g, h, v0, tUp, tDown, air: tUp + tDown, y, fall, landV };
}

function vizJump({ d }) {
  const J = jumpModel(d);
  const walk = num(d.walkSpeed, 3), run = walk * num(d.runMultiplier, 1);
  const dWalk = walk * J.air, dRun = run * J.air;
  const xMax = Math.max(6, Math.ceil(dRun + 2)), yMax = Math.max(2, Math.ceil(J.h + 1.2));
  const sc = scene(560, Math.min(300, 60 + yMax * 48), -1, xMax, -0.5, yMax);

  // уступ высотой jumpHeight (округлён вниз до шага уровня 0.25) после вершины прыжка с бега
  const ledge = Math.floor(J.h * 4 + 1e-6) / 4;
  const lx = Math.min(xMax - 1.5, Math.max(2, 0.5 + run * J.tUp + 0.6));
  if (ledge > 0) g += cubes(sc, lx, xMax, 0, ledge, '#d6d9de') + `<line x1="${sc.X(lx)}" x2="${sc.X(xMax)}" y1="${sc.Y(ledge)}" y2="${sc.Y(ledge)}" stroke="${C.green}" stroke-width="2"/>` + T(sc.X(lx) + 4, sc.Y(ledge) - 4, `уступ ${r2(ledge)} бл — запрыгивает`, { fill: C.green });

  if (st > 0) g += `<rect x="${sc.X(-1)}" y="${sc.Y(st)}" width="${sc.s * 0.6}" height="${st * sc.s}" fill="#d6d9de"/>` + T(sc.X(-1) + 2, sc.Y(st) - 3, `шаг ${r2(st)}`, { size: 10 });

  g += path(walk, C.blue) + path(run, C.orange, true);
  g += `<line x1="${sc.X(-1)}" x2="${sc.X(xMax)}" y1="${sc.Y(J.h)}" y2="${sc.Y(J.h)}" stroke="${C.blue}" stroke-dasharray="2 3" opacity=".6"/>` + T(sc.X(-1) + 2, sc.Y(J.h) - 4, `вершина ${r2(J.h)} бл`, { fill: C.blue });
  g += playerCube(sc, 0.5, 0, num(d.colliderWidth, 0.9), num(d.colliderHeight, 1), { foot: '#7d818a' });
  g += playerCube(sc, 0.5 + walk * J.tUp, J.h, num(d.colliderWidth, 0.9), num(d.colliderHeight, 1), { fill: 'none', stroke: C.blue, dash: true });
  const yt = []; for (let i = 0; i <= 60; i++) { const t = J.air * i / 60; yt.push([t, Math.max(0, J.y(t))]); }

  return `<h4>Прыжок сбоку (низ куба), клетка = 1 блок</h4>` + svgWrap(560, Math.min(300, 60 + yMax * 48), g)
    + `<div class="legend"><span><i style="background:${C.blue}"></i>шагом</span><span><i style="background:${C.orange}"></i>бегом</span></div>`
    + facts([['Высота', `${r2(J.h)} бл (${blocksReach} ${plural(blocksReach, 'куб', 'куба', 'кубов')} целиком)`], ['Скорость отрыва', `${r2(J.v0)} бл/с`], ['Подъём', `${r2(J.tUp)} с`], ['Спуск', `${r2(J.tDown)} с`], ['В воздухе', `${r2(J.air + num(d.jumpWindup))} с с замахом`], ['Дальность шагом', `${r2(dWalk)} бл`], ['Дальность бегом', `${r2(dRun)} бл`]])

function plural(n, a, b, c) { n = Math.abs(n) % 100; const m = n % 10; return n > 10 && n < 20 ? c : m > 1 && m < 5 ? b : m === 1 ? a : c; }

function vizRoll({ d }) {
  const D = num(d.rollDistance), T0 = Math.max(0.01, num(d.rollDuration, 0.45)), p = clamp(num(d.rollMidPause), 0, 0.95), ms = num(d.rollMidSpeed), hop = num(d.rollHopHeight);
  const hopLen = (1 - p) / 2, avg = (1 - p) + p * ms, base = D / T0 / Math.max(0.05, avg);
  const x1 = base * hopLen * T0, xp = base * ms * p * T0;
  const xMax = Math.max(5, Math.ceil(D + 2)), yMax = Math.max(2, Math.ceil(hop + 1.4));
  const sc = scene(560, 70 + yMax * 50, -1, xMax, -0.5, yMax);

  // путь центра куба
  const pts = [];
  for (let i = 0; i <= 120; i++) {
    const t = i / 120; let x, y;
    if (t < hopLen) { const u = t / hopLen; x = base * t * T0; y = Math.sin(u * Math.PI) * hop; }
    else if (t < hopLen + p) { x = x1 + base * ms * (t - hopLen) * T0; y = 0; }
    else { const u = (t - hopLen - p) / hopLen; x = x1 + xp + base * (t - hopLen - p) * T0; y = Math.sin(u * Math.PI) * hop; }
    pts.push([x, y, t]);

  const iF = num(d.rollInvulnerableFrom), iT = num(d.rollInvulnerableTo);
  const inv = pts.filter(q => q[2] >= iF && q[2] <= iT);
  if (inv.length > 1) g += `<polyline fill="none" stroke="${C.green}" stroke-width="10" stroke-linecap="round" opacity=".18" points="${inv.map(q => `${sc.X(0.5 + q[0]).toFixed(1)},${sc.Y(0.5 + q[1]).toFixed(1)}`).join(' ')}"/>`;
  g += `<polyline fill="none" stroke="${C.blue}" stroke-width="2" points="${pts.map(q => `${sc.X(0.5 + q[0]).toFixed(1)},${sc.Y(0.5 + q[1]).toFixed(1)}`).join(' ')}"/>`;
  g += playerCube(sc, 0.5, 0, 1, 1, { foot: '#555' });
  g += playerCube(sc, 0.5 + x1, 0, 1, 1, { foot: '#555', footTop: true, op: .55 }) + T(sc.X(0.5 + x1), sc.Y(1) - 5, 'на «голове»', { anchor: 'middle', size: 10 });
  if (xp > 0.05) g += playerCube(sc, 0.5 + x1 + xp, 0, 1, 1, { foot: '#555', footTop: true, op: .3, dash: true });
  g += playerCube(sc, 0.5 + D, 0, 1, 1, { foot: '#555', op: .8 }) + T(sc.X(0.5 + D), sc.Y(1) - 5, 'на «ногах»', { anchor: 'middle', size: 10 });
  g += `<line x1="${sc.X(0.5)}" x2="${sc.X(0.5 + D)}" y1="${sc.Y(-0.25)}" y2="${sc.Y(-0.25)}" stroke="${C.dark}" marker-end="url(#ar)" marker-start="url(#ar)"/>`;
  const defs = `<defs><marker id="ar" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="${C.dark}"/></marker></defs>`;
  const H = 70 + yMax * 50;
  // таймлайн
  const cd = num(d.rollCooldown); const tot = 1 + cd / T0; const W = 560, L = 10, R = 10, bw = (W - L - R) / tot;
  let tl = `<rect x="${L}" y="16" width="${hopLen * bw}" height="22" fill="${C.blue}" opacity=".75"/><rect x="${L + hopLen * bw}" y="16" width="${p * bw}" height="22" fill="${C.lilac}" opacity=".8"/><rect x="${L + (hopLen + p) * bw}" y="16" width="${hopLen * bw}" height="22" fill="${C.blue}" opacity=".75"/>`;
  if (cd > 0) tl += `<rect x="${L + bw}" y="16" width="${cd / T0 * bw}" height="22" fill="${C.grid2}"/>` + T(L + bw + cd / T0 * bw / 2, 31, 'перезарядка', { anchor: 'middle', size: 10, fill: C.dark });
  tl += `<rect x="${L + iF * bw}" y="42" width="${Math.max(0, iT - iF) * bw}" height="7" rx="3" fill="${C.green}"/>` + T(L + iF * bw, 62, `неуязвим ${r2(iF * T0)}–${r2(iT * T0)} с`, { size: 10, fill: C.green });
  tl += T(L, 11, '0', { size: 10 }) + T(L + bw, 11, `${r2(T0)} с`, { size: 10, anchor: 'middle' }) + (cd > 0 ? T(W - R, 11, `${r2(T0 + cd)} с`, { size: 10, anchor: 'end' }) : '');
  tl += T(L + hopLen * bw / 2, 31, 'переворот 1', { anchor: 'middle', size: 10, fill: '#fff' }) + (p > 0.08 ? T(L + (hopLen + p / 2) * bw, 31, 'пауза', { anchor: 'middle', size: 10, fill: '#fff' }) : '') + T(L + (hopLen * 1.5 + p) * bw, 31, 'переворот 2', { anchor: 'middle', size: 10, fill: '#fff' });
  return `<h4>Перекат сбоку: путь центра куба, полоса — неуязвимость</h4>` + svgWrap(560, H, defs + g)
    + `<h4>По времени</h4>` + svgWrap(560, 68, tl)
    + facts([['Длина', `${r2(D)} бл`], ['Каждый переворот', `${r2(x1)} бл за ${r2(hopLen * T0)} с`], ['Скольжение в паузе', `${r2(xp)} бл`], ['Скорость в полёте', `${r2(base)} бл/с`], ['Неуязвимость', `${r2(Math.max(0, iT - iF) * T0)} с`], ['Перекатов в секунду (макс.)', r2(1 / (T0 + cd))]]);
}

function vizStamina({ d, f }) {

    + facts([['Полное восстановление', `${r2(full)} с`], ['Со щитом', `${r2(fullBlock)} с`], ['Один перекат восстанавливается', `${r2(delay + roll / regen)} с`]]);

function springSim(k, c, x0, v0, T, n = 300) { const pts = []; let x = x0, v = v0; const dt = T / n; for (let i = 0; i <= n; i++) { pts.push([i * dt, x]); for (let j = 0; j < 4; j++) { const a = -k * x - c * v; v += a * dt / 4; x += v * dt / 4; } } return pts; }
function settleTime(pts, x0) { const eps = Math.abs(x0) * 0.05; for (let i = pts.length - 1; i >= 0; i--) if (Math.abs(pts[i][1]) > eps) return pts[Math.min(pts.length - 1, i + 1)][0]; return 0; }

function cubeShape(cx, by, size, squash, bend = 0, color = '#b3b6bd') {
  const sy = 1 + squash, sx = 1 / Math.sqrt(Math.max(0.1, sy));
  const w = size * sx, h = size * sy, x0 = cx - w / 2, top = by - h, b = bend * size;
  return `<path d="M${x0},${by} Q${x0 + b * 0.6},${by - h / 2} ${x0 + b},${top} L${x0 + w + b},${top} Q${x0 + w + b * 0.6},${by - h / 2} ${x0 + w},${by} Z" fill="${color}" stroke="#7d818a" stroke-width="1.2" stroke-linejoin="round"/>`;
}
function vizDeform({ d }) {
  const df = d.deformation || {};
  const k = num(df.stiffness, 220), c = num(df.damping, 9);
  const J = jumpModel(d);
  const landSq = Math.max(num(df.maxLandSquash, -0.4), num(df.landSquashPerSpeed, -0.035) * J.landV);
  const shapes = [['покой', 0, 0], ['замах', num(df.jumpWindupSquash), 0], ['отрыв', num(df.jumpTakeoffStretch), 0], ['приземление', landSq, 0], ['перекат', num(df.rollLandSquash), num(df.rollBend)], ['удар', num(df.hitSquash), 0], ['ходьба', 0, num(df.walkBend)]];
  const W = 560, H = 120, step = W / shapes.length; let g = `<line x1="0" x2="${W}" y1="${H - 26}" y2="${H - 26}" stroke="${C.grid2}"/>`;
  shapes.forEach(([n, sq, b], i) => { const cx = step * (i + 0.5); g += cubeShape(cx, H - 26, 44, sq, b) + T(cx, H - 12, n, { anchor: 'middle', size: 10 }) + T(cx, H - 1, sq ? (sq > 0 ? '+' : '') + r2(sq) : b ? `изгиб ${r2(b)}` : '', { anchor: 'middle', size: 9 }); });
  const resp = springSim(k, c, landSq, 0, 1.2);
  const zeta = c / (2 * Math.sqrt(k));
  return `<h4>Формы куба</h4>` + svgWrap(W, H, g)
    + `<h4>Возврат формы после приземления с прыжка (wobble)</h4>` + chart(560, 160, [{ pts: resp, c: C.blue }], { xl: 'секунды' })
    + facts([['Успокаивается за', `${r2(settleTime(resp, landSq))} с`], ['Колебаний', zeta >= 1 ? 'нет (переторможено)' : zeta > 0.6 ? 'почти нет' : zeta > 0.3 ? 'одно-два' : 'много'], ['Приземление с прыжка', `${r2(J.landV)} бл/с → сжатие ${r2(landSq)}`], ['Период покачивания ходьбы', `${r2(2 / Math.max(0.01, num(df.walkSwayPerMeter, 1.6)))} бл`]]);
}

function vizCamera({ d }) {
  const P = num(d.pitch, 35) * Math.PI / 180, dist = num(d.distance, 26), fov = num(d.fieldOfView, 25) * Math.PI / 180;
  const minD = num(d.minDistance, 14), maxD = num(d.maxDistance, 40);
  const W = 560, H = 230;
  const span = Math.max(maxD, dist) * 1.05;
  const s = Math.min((W - 60) / (span * Math.cos(P) + span * 0.35), (H - 40) / (span * Math.sin(P) + 2));
  const ox = W - 40 - span * 0.3 * s, oy = H - 22;
  const X = x => ox + x * s, Y = y => oy - y * s;
  let g = `<rect x="0" y="${oy}" width="${W}" height="${H - oy}" fill="${C.ground}"/>`;
  // зона зума
  const arc = (r, col, dash) => `<path d="M${X(-r)},${Y(0)} A${r * s},${r * s} 0 0 1 ${X(0)},${Y(r)}" fill="none" stroke="${col}" ${dash ? 'stroke-dasharray="3 3"' : ''}/>`;
  g += arc(minD, C.grid2, true) + arc(maxD, C.grid2, true);
  const cam = [-dist * Math.cos(P), dist * Math.sin(P)];
  // лучи FOV до земли
  const ray = a => { const dx = Math.cos(a), dy = -Math.sin(a); const t = dy < -1e-4 ? -cam[1] / dy : null; return t && t < span * 4 ? [cam[0] + dx * t, 0] : [cam[0] + dx * span * 2, cam[1] + dy * span * 2]; };
  const near = ray(P + fov / 2), far = ray(P - fov / 2);
  g += `<polygon points="${X(cam[0])},${Y(cam[1])} ${X(near[0])},${Y(near[1])} ${X(far[0])},${Y(far[1])}" fill="${C.blue}" opacity=".08"/>`;
  g += `<line x1="${X(cam[0])}" y1="${Y(cam[1])}" x2="${X(near[0])}" y2="${Y(near[1])}" stroke="${C.blue}" opacity=".5"/><line x1="${X(cam[0])}" y1="${Y(cam[1])}" x2="${X(far[0])}" y2="${Y(far[1])}" stroke="${C.blue}" opacity=".5"/>`;
  g += `<line x1="${X(cam[0])}" y1="${Y(cam[1])}" x2="${X(0)}" y2="${Y(0.5)}" stroke="${C.dark}" stroke-dasharray="5 3"/>`;
  g += `<rect x="${X(-0.5)}" y="${Y(1)}" width="${Math.max(3, s)}" height="${Math.max(3, s)}" fill="#7d818a"/>`;
  g += `<g transform="translate(${X(cam[0])},${Y(cam[1])}) rotate(${P * 180 / Math.PI})"><rect x="-12" y="-7" width="18" height="14" rx="2" fill="${C.dark}"/><path d="M6,-5 L14,-9 L14,9 L6,5 Z" fill="${C.dark}"/></g>`;
  g += `<path d="M${X(-Math.min(6, dist * 0.25))},${Y(0)} A${Math.min(6, dist * 0.25) * s},${Math.min(6, dist * 0.25) * s} 0 0 1 ${X(-Math.min(6, dist * 0.25) * Math.cos(P))},${Y(Math.min(6, dist * 0.25) * Math.sin(P))}" fill="none" stroke="${C.orange}" stroke-width="1.5"/>`;
  g += T(X(-Math.min(6, dist * 0.25)) - 4, Y(0) - 6, `${r2(num(d.pitch), 0)}°`, { anchor: 'end', fill: C.orange, size: 11 });
  g += T(X(-minD) + 4, Y(0) - 4, `мин ${r2(minD)}`, { size: 10 }) + T(X(-maxD) + 4, Y(0) - 4, `макс ${r2(maxD)}`, { size: 10 });
  const visH = 2 * dist * Math.tan(fov / 2), visW = visH * 16 / 9;
  const groundDepth = far[1] === 0 && near[1] === 0 ? Math.abs(far[0] - near[0]) : Infinity;
  // вид сверху: yaw
  const yaw = num(d.startYaw, 45), stp = num(d.fixedAngleStep, 90);
  const R = 46; let top = `<circle cx="60" cy="60" r="${R}" fill="#fff" stroke="${C.grid2}"/><rect x="52" y="52" width="16" height="16" fill="#b3b6bd" stroke="#7d818a" transform="rotate(${-0} 60 60)"/>`;
  if (d.scheme === 'FixedAngles' && stp > 0) for (let a = yaw; a < yaw + 360 - 1e-6; a += stp) { const r = (a - 90) * Math.PI / 180; top += `<circle cx="${60 - Math.cos(r) * R}" cy="${60 + Math.sin(r) * R}" r="3" fill="${C.grid2}"/>`; }
  const yr = (yaw - 90) * Math.PI / 180; const cx = 60 - Math.cos(yr) * R, cy = 60 + Math.sin(yr) * R;
  top += `<line x1="${cx}" y1="${cy}" x2="60" y2="60" stroke="${C.blue}" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="6" fill="${C.dark}"/>` + T(60, 10, 'С', { anchor: 'middle', size: 9 }) + T(60, 118, '', {});
  return `<h4>Сбоку: камера, наклон и поле зрения (масштаб общий)</h4>` + svgWrap(W, H, g)
    + facts([['В кадре по вертикали у куба', `≈ ${r2(visH, 1)} бл`], ['По горизонтали (16:9)', `≈ ${r2(visW, 1)} бл`], ['Глубина видимой земли', Number.isFinite(groundDepth) ? `≈ ${r2(groundDepth, 1)} бл` : 'до горизонта'], ['Высота камеры', `${r2(cam[1], 1)} бл`], ['Щелчков колеса от мин. до макс.', r2(Math.ceil((maxD - minD) / Math.max(0.01, num(d.zoomStep, 2))), 0)]])
    + `<div style="display:flex;gap:16px;align-items:center;margin-top:8px">${svgWrap(120, 122, top)}<div style="font-size:12.5px;color:var(--muted)">Вид сверху: камера (●) смотрит на куб под углом <b style="color:var(--text)">${r2(yaw, 0)}°</b>.${d.scheme === 'FixedAngles' ? ` Точки — фиксированные углы через ${r2(stp, 0)}°.` : ' FreeOrbit: поворот свободный.'}</div></div>`;
}

function itemDamage(it, step, combat) { return num(it.damage) * num(step.damageMultiplier, 1); }
function vizCombat({ d }) {
  const m = num(d.sameColorMultiplier, 1.5);
  const rows = Object.entries(itemsData()).filter(([, it]) => it.combo?.length).map(([id, it]) => {
    const hits = it.combo.map(s => itemDamage(it, s));
    const total = hits.reduce((a, b) => a + b, 0);
    return `<tr><td><span class="swatch" style="background:${esc(colorHex(it.color))}"></span> ${esc(it.name || id)}</td><td>${hits.map(h => r2(h, 1)).join(' / ')}</td><td>${r2(total, 1)}</td><td><b>${r2(total * m, 1)}</b></td></tr>`;
  }).join('');
  const hs = num(d.hitStop);
  return `<h4>Урон серии: обычный враг / враг того же цвета</h4><table class="dmg"><tr><th>Оружие</th><th>Удары</th><th>Серия</th><th>Тот же цвет ×${r2(m)}</th></tr>${rows || '<tr><td colspan="4">Нет оружия с комбо</td></tr>'}</table>`
    + facts([['Хит-стоп', hs ? `${r2(hs * 1000, 0)} мс ≈ ${r2(hs * 60, 1)} кадра при 60 FPS` : 'выключен'], ['Тряска', num(d.hitShake) ? r2(num(d.hitShake)) : 'выключена']])
    + `<h4>Свечение оружия</h4><div style="display:flex;gap:10px">${Object.values(itemsData()).filter(it => it.color && it.color !== 'none').map(it => { const g = num(d.heldWeaponGlow); return `<div style="text-align:center;font-size:11px;color:var(--muted)"><div style="width:34px;height:34px;border-radius:6px;background:${esc(colorHex(it.color))};box-shadow:0 0 ${r2(g * 30, 0)}px ${r2(g * 10, 0)}px ${esc(colorHex(it.color))}55;margin:6px auto"></div>${esc(it.name)}</div>`; }).join('')}</div>`;
}

function vizDummy({ d }) {
  const k = num(d.stiffness, 120), c = num(d.damping, 7), push = num(d.tiltPerHit, 9) * 12, mx = num(d.maxTilt, 20);
  const pts = []; let x = 0, v = push; const dt = 1.5 / 300;
  for (let i = 0; i <= 300; i++) { pts.push([i * dt, x]); v += (-x * k - v * c) * dt; x += v * dt; x = clamp(x, -mx, mx); }
  const peak = Math.max(...pts.map(p => Math.abs(p[1])));
  const fd = num(d.flashDuration);
  return `<h4>Наклон после одного удара (отбрасывание 1)</h4>` + chart(560, 170, [{ pts, c: colorHex(d.color) }], { xl: 'секунды', marks: [{ x: fd, l: 'конец вспышки', c: d.flashColor }] })
    + facts([['Пик наклона', `${r2(peak, 1)}°`], ['Успокаивается за', `${r2(settleTime(pts, peak))} с`], ['Вспышка', `${r2(fd)} с`]])
    + `<div style="display:flex;gap:14px;align-items:center;margin-top:8px"><div style="width:44px;height:44px;border-radius:6px;background:${esc(colorHex(d.color))}"></div><div style="width:44px;height:44px;border-radius:6px;background:${esc(d.flashColor || '#fff')};box-shadow:0 0 ${r2(num(d.flashIntensity) * 8, 0)}px ${esc(d.flashColor || '#fff')}"></div><span style="font-size:12px;color:var(--muted)">цвет манекена → вспышка при ударе</span></div>`;
}

function vizInventory({ d }) {
  const cols = clamp(Math.round(num(d.columns, 5)), 1, 12), rows = clamp(Math.round(num(d.rows, 5)), 1, 12), q = clamp(Math.round(num(d.quickSlots, 4)), 0, 12);
  const cs = 38, gap = 5, W = 560;
  const gw = cols * (cs + gap);

  g += `<rect x="10" y="10" width="${cs}" height="${cs}" rx="5" fill="#fff" stroke="${C.green}" stroke-width="2"/>` + T(10 + cs / 2, 10 + cs + 13, 'левая', { anchor: 'middle', size: 10 });
  g += `<rect x="${10 + cs + 24}" y="${10 + cs * 0.1}" width="${cs * 0.8}" height="${cs * 0.8}" fill="#b3b6bd" stroke="#7d818a"/>`;
  g += `<rect x="${10 + cs * 2 + 34}" y="10" width="${cs}" height="${cs}" rx="5" fill="#fff" stroke="${C.grid2}" stroke-width="1.5"/>` + T(10 + cs * 2.5 + 34, 10 + cs + 13, 'правая', { anchor: 'middle', size: 10 });
  const gx = 190;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) g += `<rect x="${gx + c * (cs + gap)}" y="${10 + r * (cs + gap)}" width="${cs}" height="${cs}" rx="5" fill="#fff" stroke="${C.grid2}"/>`;

  const H = qy + (q ? cs : 0) + 12;
  return `<h4>Окно инвентаря (слева — руки, зелёным — куда можно надеть)</h4>` + svgWrap(Math.max(W, gx + gw + 10), H, g)
    + facts([['Ячеек', String(cols * rows)], ['Быстрых слотов', String(q)]]);
}

function vizItem({ id, it }) {
  const col = colorHex(it.color);
  const combo = it.combo || [];
  if (it.kind === 'Shield') {
    const a = num(it.blockAngle, 120); const W = 260, H = 200, cx = W / 2, cy = 130, R = 90;
    const p = ang => [cx + Math.sin(ang * Math.PI / 180) * R, cy - Math.cos(ang * Math.PI / 180) * R];
    const [x1, y1] = p(-a / 2), [x2, y2] = p(a / 2);
    const g = `<path d="M${cx},${cy} L${x1},${y1} A${R},${R} 0 ${a > 180 ? 1 : 0} 1 ${x2},${y2} Z" fill="${col}" opacity=".25" stroke="${col}"/><rect x="${cx - 12}" y="${cy - 12}" width="24" height="24" fill="#b3b6bd" stroke="#7d818a"/><line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - R - 8}" stroke="${C.dark}" stroke-dasharray="3 3"/>` + T(cx, 12, 'вперёд', { anchor: 'middle', size: 10 });
    return `<h4>Сверху: сектор блока ${r2(a, 0)}°</h4>` + svgWrap(W, H, g) + facts([['Рука', it.hand || 'Any'], ['Блок гасит удары', `в секторе ${r2(a, 0)}° перед кубом`]]);
  }
  if (!combo.length) return '<div style="color:var(--muted)">Нет серии ударов.</div>';
  // сверху: дальность и сектор каждого удара
  const maxR = Math.max(1.5, ...combo.map(s => num(s.range, 1.3) + num(s.lunge, 0)));
  const W = 260, H = 240, cx = W / 2, cy = H - 40, s = (H - 60) / maxR;
  let g = '';
  for (let r = 1; r <= Math.floor(maxR); r++) g += `<circle cx="${cx}" cy="${cy}" r="${r * s}" fill="none" stroke="${C.grid}"/>` + T(cx + 3, cy - r * s - 2, `${r} бл`, { size: 9 });
  combo.forEach((st, i) => {
    const a = clamp(num(st.arc, 150), 1, 360), R = num(st.range, 1.3) * s, ly = num(st.lunge, 0) * s;
    const pt = ang => [cx + Math.sin(ang * Math.PI / 180) * R, cy - ly - Math.cos(ang * Math.PI / 180) * R];
    const [x1, y1] = pt(-a / 2), [x2, y2] = pt(a / 2);
    g += a >= 359 ? `<circle cx="${cx}" cy="${cy - ly}" r="${R}" fill="${col}" fill-opacity=".12" stroke="${col}" stroke-opacity=".8"/>`
      : `<path d="M${cx},${cy - ly} L${x1},${y1} A${R},${R} 0 ${a > 180 ? 1 : 0} 1 ${x2},${y2} Z" fill="${col}" fill-opacity=".12" stroke="${col}" stroke-opacity="${0.4 + 0.6 * (i + 1) / combo.length}" stroke-width="1.3"/>`;
  });
  g += `<rect x="${cx - s / 2}" y="${cy - s / 2}" width="${s}" height="${s}" fill="#b3b6bd" stroke="#7d818a"/>` + T(cx, cy + s / 2 + 14, 'куб 1×1', { anchor: 'middle', size: 10 });
  // таймлайн
  const cw = num(it.comboWindow, 0);
  // Фазы удара в секундах: замах, удар, фиксация (окно комбо), возврат. Старые поля — как запасной вариант.
  const phases = st => {
    if (st.windup !== undefined || st.strike !== undefined) return { w: num(st.windup, 0.18), s: num(st.strike, 0.08), h: num(st.hold, 0.22), r: num(st.recovery, 0.14) };
    let d = num(st.duration, 0.38), af = num(st.activeFrom, 0.3), at = num(st.activeTo, 0.65); if (af > at) [af, at] = [at, af];
    return { w: d * af, s: d * (at - af), h: num(st.hold, 0.22), r: d * (1 - at) };
  };
  const total = combo.reduce((a, st) => { const p = phases(st); return a + p.w + p.s + p.h + p.r; }, 0) + cw;
  const TW = 290, L = 4, sx = (TW - L * 2) / Math.max(0.01, total); let x = L, tl = '';
  combo.forEach((st, i) => {
    const p = phases(st), dur = p.w + p.s + p.h + p.r;
    tl += `<rect x="${x}" y="18" width="${Math.max(0, dur * sx - 2)}" height="20" rx="3" fill="${C.grid2}"/>`
      + `<rect x="${x + p.w * sx}" y="18" width="${p.s * sx}" height="20" fill="${col}" fill-opacity=".55"/>`
      + `<rect x="${x + (p.w + p.s * num(st.hitFrom, 0)) * sx}" y="18" width="${Math.max(0, p.s * (num(st.hitTo, 1) - num(st.hitFrom, 0))) * sx}" height="20" fill="${col}"/>`
      + `<rect x="${x + (p.w + p.s) * sx}" y="18" width="${p.h * sx}" height="20" fill="${col}" fill-opacity=".35"/>`
      + T(x + 3, 13, `${i + 1}`, { size: 10, fill: C.dark, weight: 600 });
    x += dur * sx;
  });
  tl += `<rect x="${x}" y="24" width="${cw * sx}" height="8" rx="3" fill="${C.grid}" stroke="${C.grid2}" stroke-dasharray="2 2"/>` + T(x + 2, 13, 'окно', { size: 9 });
  tl += T(L, 52, '0', { size: 9 }) + T(TW - L, 52, `${r2(total)} с`, { size: 9, anchor: 'end' });
  const dmg = combo.map(st => itemDamage(it, st));
  const sta = combo.reduce((a, st) => a + num(st.staminaCost, 12), 0);
  const cm = num(S.files.Combat?.data?.sameColorMultiplier, 1.5);
  return `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start"><div><h4>Сверху: дальность и сектор</h4>${svgWrap(W, H, g)}</div><div style="flex:1;min-width:280px"><h4>Серия по времени: серый — замах и возврат, цвет — удар (ярко — окно урона), светлый — пауза (окно комбо)</h4>${svgWrap(TW, 56, tl)}
    <table class="dmg" style="margin-top:8px"><tr><th>#</th><th>Движение</th><th>Урон</th><th>Цвет ×${r2(cm)}</th><th>Выносл.</th></tr>${combo.map((st, i) => `<tr><td>${i + 1}</td><td>${esc((MOTIONS.find(m => m[0] === st.motion) || [, st.motion])[1])}</td><td>${r2(dmg[i], 1)}</td><td>${r2(dmg[i] * cm, 1)}</td><td>${r2(num(st.staminaCost, 12), 0)}</td></tr>`).join('')}
    <tr><th></th><th>Серия</th><th>${r2(dmg.reduce((a, b) => a + b, 0), 1)}</th><th>${r2(dmg.reduce((a, b) => a + b, 0) * cm, 1)}</th><th>${r2(sta, 0)}</th></tr></table>
    ${facts([['Урон в секунду', r2(dmg.reduce((a, b) => a + b, 0) / Math.max(0.01, total - cw), 1)], ['Рука', ({ Any: 'любая', Left: 'левая', Right: 'правая' })[it.hand || 'Any'] || it.hand], ['Тип', it.kind === 'TwoHanded' ? 'двуручное' : 'одноручное']])}</div></div>`;
}

function vizEnemy({ e }) {
  const col = colorHex(e.color || 'blue');
  const size = num(e.size, 0.8), aggro = num(e.aggroRadius, 7), lose = Math.max(aggro, num(e.loseRadius, 13)), wait = num(e.waitDistance, 3.2);
  const attacks = e.attacks || [];
  const ph = a => [num(a.windup, 1.5), num(a.strike, 0.1), num(a.hold, 0.3), num(a.recovery, 0.5)];
  // 1. Зоны сверху
  const W = 270, H = 270, cx = W / 2, cy = H / 2, s = (W / 2 - 14) / Math.max(1, lose);
  let z = '';
  const ring = (r, c, label, dash, fillOp = 0) => `<circle cx="${cx}" cy="${cy}" r="${r * s}" fill="${c}" fill-opacity="${fillOp}" stroke="${c}" ${dash ? 'stroke-dasharray="4 3"' : ''}/>` + (label ? T(cx, cy - r * s + 12, label, { anchor: 'middle', size: 10, fill: c }) : '');
  z += ring(lose, C.text, `потеря ${r2(lose)}`, true) + ring(aggro, C.orange, `агро ${r2(aggro)}`, false, 0.06) + ring(wait, C.lilac, `ожидание ${r2(wait)}`, true);
  const maxR = Math.max(0, ...attacks.map(a => num(a.range, 1.5)));
  if (maxR > 0) z += ring(maxR, col, '', false, 0.25);
  z += `<rect x="${cx - size * s / 2}" y="${cy - size * s / 2}" width="${Math.max(3, size * s)}" height="${Math.max(3, size * s)}" fill="${col}"/>`;
  // 2. Атаки крупно, с кубом игрока для масштаба
  const W2 = 270, H2 = 270, reach = Math.max(1.5, ...attacks.map(a => num(a.range, 1.5) + num(a.lunge, 0.3))) + 0.6;
  const s2 = (H2 - 50) / reach, ex = W2 / 2, ey = H2 - 28;
  let g = '';
  for (let r = 1; r <= Math.floor(reach); r++) g += `<circle cx="${ex}" cy="${ey}" r="${r * s2}" fill="none" stroke="${C.grid}"/>` + T(ex + 3, ey - r * s2 - 2, `${r} бл`, { size: 9 });
  const palette = [col, C.dark, C.orange, C.teal, C.red];
  attacks.forEach((a, i) => {
    const arc = clamp(num(a.arc, 140), 1, 360), R = num(a.range, 1.5) * s2, ly = num(a.lunge, 0.3) * s2, c = palette[i % palette.length];
    const pt = ang => [ex + Math.sin(ang * Math.PI / 180) * R, ey - ly - Math.cos(ang * Math.PI / 180) * R];
    const [x1, y1] = pt(-arc / 2), [x2, y2] = pt(arc / 2);
    g += arc >= 359 ? `<circle cx="${ex}" cy="${ey - ly}" r="${R}" fill="${c}" fill-opacity=".12" stroke="${c}"/>`
      : `<path d="M${ex},${ey - ly} L${x1},${y1} A${R},${R} 0 ${arc > 180 ? 1 : 0} 1 ${x2},${y2} Z" fill="${c}" fill-opacity=".12" stroke="${c}" stroke-width="1.4"/>`;
    g += T(x2 + 3, y2, String(i + 1), { size: 10, fill: c, weight: 600 });
  });
  g += `<rect x="${ex - size * s2 / 2}" y="${ey - size * s2 / 2}" width="${size * s2}" height="${size * s2}" fill="${col}" stroke="#00000033"/>`;
  g += `<rect x="10" y="10" width="${s2}" height="${s2}" fill="#b3b6bd" stroke="#7d818a"/>` + T(10 + s2 / 2, 10 + s2 + 12, 'игрок 1×1', { anchor: 'middle', size: 9 });
  // 3. Таймлайн атак
  const cd = num(e.attackCooldown, 0.8);
  const total = Math.max(0.1, ...attacks.map(a => ph(a).reduce((x, y) => x + y, 0) + cd));
  const TW = 560, L = 64, R0 = 8, sx = (TW - L - R0) / total, rowH = 26;
  const phc = [C.yellow, C.red, C.orange, C.grid2];
  let tl = '';
  attacks.forEach((a, i) => {
    const y = 8 + i * rowH; let x = L;
    tl += T(4, y + 14, `${i + 1}. ${(ENEMY_MOTIONS.find(m => m[0] === a.motion) || [, a.motion])[0]}`, { size: 10, fill: C.dark });
    ph(a).forEach((d, k) => { if (d > 0) tl += `<rect x="${x}" y="${y}" width="${Math.max(1, d * sx - 1)}" height="18" fill="${phc[k]}" ${k === 1 ? '' : 'opacity=".75"'}/>`; x += d * sx; });
    if (cd > 0) tl += `<rect x="${x}" y="${y + 5}" width="${cd * sx}" height="8" rx="3" fill="none" stroke="${C.grid2}" stroke-dasharray="2 2"/>`;
    tl += T(x + cd * sx + 3 > TW - 30 ? TW - 4 : x + cd * sx + 3, y + 13, `${r2(x / sx - L / sx + cd)} с`, { size: 9, anchor: x + cd * sx + 3 > TW - 30 ? 'end' : 'start' });
  });
  const tlH = 14 + attacks.length * rowH;
  // Сколько ударов нужно игроку
  const sameMul = num(S.files.Combat?.data?.sameColorMultiplier, 1.5), hp = Math.max(1, num(e.maxHealth, 40));
  const weapons = Object.entries(itemsData()).filter(([, it]) => it.combo?.length && num(it.damage) > 0);
  const killRows = weapons.map(([wid, it]) => {
    const mul = it.color && it.color === e.color ? sameMul : 1;
    let left = hp, n = 0; while (left > 0 && n < 999) { left -= itemDamage(it, it.combo[n % it.combo.length]) * mul; n++; }
    return `<tr><td><span class="swatch" style="background:${esc(colorHex(it.color))}"></span> ${esc(it.name || wid)}</td><td>${mul > 1 ? `×${r2(mul)} (тот же цвет)` : '—'}</td><td><b>${n >= 999 ? '∞' : n}</b></td></tr>`;
  }).join('');
  const wsum = attacks.reduce((x, a) => x + Math.max(0, num(a.weight, 1)), 0) || 1;
  const avgDmg = attacks.reduce((x, a) => x + num(a.damage, 15) * Math.max(0, num(a.weight, 1)), 0) / wsum;
  const avgCycle = attacks.reduce((x, a) => x + (ph(a).reduce((p, q) => p + q, 0) + cd) * Math.max(0, num(a.weight, 1)), 0) / wsum;
  const pWalk = num(S.files.Player?.data?.walkSpeed, 0), speed = num(e.moveSpeed, 4.5);
  const toFirst = num(e.alertDuration, 2) + Math.max(0, aggro - maxR) / Math.max(0.01, speed);
  const pHp = num(S.files.Player?.data?.maxHealth, 0);
  return `<div style="display:flex;gap:10px;flex-wrap:wrap"><div><h4>Зоны сверху (масштаб по радиусу потери)</h4>${svgWrap(W, H, z)}</div><div><h4>Атаки сверху, цифры — номер атаки</h4>${svgWrap(W2, H2, g)}</div></div>`
    + `<h4>Атаки по времени</h4>${svgWrap(TW, tlH, tl)}<div class="legend"><span><i style="background:${C.yellow}"></i>замах (реакция игрока)</span><span><i style="background:${C.red}"></i>удар (урон)</span><span><i style="background:${C.orange}"></i>фиксация</span><span><i style="background:${C.grid2}"></i>возврат</span><span><i style="border:1px dashed ${C.grid2};height:6px"></i>пауза между атаками</span></div>`
    + facts([
      ['Скорость', pWalk ? `${r2(speed)} бл/с (${r2(speed / pWalk * 100, 0)}% ходьбы игрока)` : `${r2(speed)} бл/с`],
      ['От агро до первого удара', `≈ ${r2(toFirst + (attacks[0] ? ph(attacks[0])[0] : 0), 1)} с`],
      ['Средний урон атаки', r2(avgDmg, 1)],
      ['Урон в секунду в упор', r2(avgDmg / Math.max(0.01, avgCycle), 1)],
      ...(pHp ? [['Ударов до смерти игрока', String(Math.ceil(pHp / Math.max(0.01, avgDmg)))]] : []),
      ['Опыт', `${r2(num(e.experience, 10), 0)} (${r2(num(e.experiencePieces, 6), 0)} из ${r2(num(e.deathPieces, 14), 0)} осколков)`],
    ])
    + `<h4>Ударов игрока до победы (${r2(hp, 0)} ед. здоровья)</h4><table class="dmg"><tr><th>Оружие</th><th>Бонус цвета</th><th>Ударов</th></tr>${killRows || '<tr><td colspan="3">Нет оружия с уроном в Items.json</td></tr>'}</table>`;
}

/* =====================================================================
   Запуск
   ===================================================================== */
$('#btnOpen').onclick = pickDir;
$('#btnSaveAll').onclick = saveAll;
$('#fileInput').onchange = async e => {
  const list = [...e.target.files]; if (!list.length) return;
  S.files = {}; S.dir = null; S.mode = 'files';
  for (const file of list) addFile(file.name.replace(/\.json$/i, ''), await file.text(), null);
  S.current = firstFile(); renderAll(); e.target.value = '';
};
window.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveAll(); } });
window.addEventListener('beforeunload', e => { if (Object.keys(S.files).some(isDirty)) { e.preventDefault(); e.returnValue = ''; } });

(async function init() {
  renderAll();
  // Запомненная папка: браузер попросит подтвердить доступ одним нажатием.
  try {
    const dir = window.showDirectoryPicker && await IDB.get('dir');
    if (dir) {
      const b = $('#btnReopen'); b.style.display = ''; b.textContent = `Открыть снова: ${dir.name}`;
      b.onclick = async () => { try { if (await ensureWrite(dir)) { b.style.display = 'none'; await openDir(dir); } } catch (e) { toast('Папка недоступна: ' + e.message); } };
    }
  } catch { /* нет IndexedDB */ }
  // Если страницу отдаёт локальный сервер из корня проекта — подхватить конфиги для просмотра.
  if (location.protocol.startsWith('http')) {
    const base = new URL('../../Assets/StreamingAssets/Configs/', location.href);
    for (const n of FILE_ORDER) { try { const r = await fetch(new URL(n + '.json', base)); if (r.ok) addFile(n, await r.text(), null); } catch { } }
    if (Object.keys(S.files).length) { S.mode = 'fetch'; S.current = firstFile(); renderAll(); }
  }
})();
</script>
