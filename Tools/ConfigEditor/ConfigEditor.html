}

function vizMoveProfile({ p }) {
  const st = num(p.stepHeight, 0.3), jh = num(p.jumpHeight, 0), md = num(p.maxDrop, 1), h = num(p.height, 1);
  const yMax = Math.max(3, Math.ceil(Math.max(jh, h) + 1)), yMin = -Math.max(1, Math.ceil(md + 0.5));
  const sc = scene(560, Math.min(320, 40 + (yMax - yMin) * 34), -1, 13, yMin, yMax);
  let g = sc.g;
  g += cubes(sc, -1, 6, yMin, 0) + cubes(sc, 2, 6, 0, st, '#d6d9de') + T(sc.X(2) + 2, sc.Y(st) - 3, `шаг ${r2(st)}`, { size: 10 });
  const jl = jh > st ? jh : 0;
  if (jl > 0) g += cubes(sc, 4, 6, st, jl, '#cfd3d9') + `<line x1="${sc.X(4)}" x2="${sc.X(6)}" y1="${sc.Y(jl)}" y2="${sc.Y(jl)}" stroke="${C.green}" stroke-width="2"/>` + T(sc.X(4) + 2, sc.Y(jl) - 4, `прыжок ${r2(jl)}`, { size: 10, fill: C.green });
  else g += T(sc.X(4), sc.Y(st) - 16, 'не прыгает', { size: 10 });
  g += cubes(sc, 6, 13, yMin, -md, C.ground) + `<line x1="${sc.X(6)}" x2="${sc.X(13)}" y1="${sc.Y(-md)}" y2="${sc.Y(-md)}" stroke="${C.orange}" stroke-width="2"/>` + T(sc.X(6) + 4, sc.Y(-md) - 4, `спрыгивает с ${r2(md)}`, { size: 10, fill: C.orange });
  g += playerCube(sc, 0.5, 0, 0.9, h) + T(sc.X(0.5), sc.Y(h) - 4, `рост ${r2(h)}`, { anchor: 'middle', size: 10 });
  return `<h4>Что проходит этот профиль</h4>` + svgWrap(560, Math.min(320, 40 + (yMax - yMin) * 34), g)
    + facts([['Диагонали', p.diagonal === false ? 'нет' : 'да'], ['Особые связи', (p.specials || []).map(s => (SPECIALS.find(x => x[0] === s) || [, s])[1]).join(', ') || 'нет']]);
}

function vizEnemy({ e }) {
  const col = colorHex(e.color || 'blue');
  // Радиус агро — у каждого врага в уровне; здесь для картинки берём значение по умолчанию (LevelEnemy.DefaultAggroRadius).
  const size = num(e.size, 0.9), aggro = 7, lose = Math.max(aggro, num(e.loseRadius, 13)), wait = num(e.waitDistance, 3.2);
  const attacks = e.attacks || [];
  const ph = enemyAttackPhases;
  // 1. Зоны сверху
  const W = 270, H = 270, cx = W / 2, cy = H / 2, s = (W / 2 - 14) / Math.max(1, lose);
  let z = '';
  const ring = (r, c, label, dash, fillOp = 0) => `<circle cx="${cx}" cy="${cy}" r="${r * s}" fill="${c}" fill-opacity="${fillOp}" stroke="${c}" ${dash ? 'stroke-dasharray="4 3"' : ''}/>` + (label ? T(cx, cy - r * s + 12, label, { anchor: 'middle', size: 10, fill: c }) : '');
  z += ring(lose, C.text, `потеря ${r2(lose)}`, true) + ring(aggro, C.orange, `агро ${r2(aggro)} (по умолч., задаётся в уровне)`, false, 0.06) + ring(wait, C.lilac, `ожидание ${r2(wait)}`, true);
  const maxR = Math.max(0, ...attacks.map(a => num(a.range, 1.5)));
  if (maxR > 0) z += ring(maxR, col, '', false, 0.25);
  z += `<rect x="${cx - size * s / 2}" y="${cy - size * s / 2}" width="${Math.max(3, size * s)}" height="${Math.max(3, size * s)}" fill="${col}"/>`;
  // 2. Атаки крупно, с кубом игрока для масштаба
  const W2 = 270, H2 = 270, reach = Math.max(1.5, ...attacks.map(a => num(a.range, 1.5) + Math.max(0, num(a.lunge, 0.3)))) + 0.6;
  const back2 = Math.max(0, ...attacks.map(a => -num(a.lunge, 0.3))); // отрицательный рывок — шаг назад
  const s2 = (H2 - 50) / (reach + back2), ex = W2 / 2, ey = H2 - 28 - back2 * s2;
  let g = '';
  for (let r = 1; r <= Math.floor(reach); r++) g += `<circle cx="${ex}" cy="${ey}" r="${r * s2}" fill="none" stroke="${C.grid}"/>` + T(ex + 3, ey - r * s2 - 2, `${r} бл`, { size: 9 });
  const palette = [col, C.dark, C.orange, C.teal, C.red];
  attacks.forEach((a, i) => {
    const c = palette[i % palette.length];
    const ly = num(a.lunge, 0.3) * s2;
    if (num(a.areaRadius, 0) > 0) {
      // Удар по области: круг вокруг точки удара о землю.
      const AR = num(a.areaRadius, 0) * s2, oy = ey - ly - num(a.areaOffset, 1) * s2;
      g += `<circle cx="${ex}" cy="${oy}" r="${AR}" fill="${c}" fill-opacity=".14" stroke="${c}" stroke-width="1.4" stroke-dasharray="5 3"/>` + T(ex + AR + 3, oy, String(i + 1), { size: 10, fill: c, weight: 600 });
      return;
    }
    const arc = clamp(num(a.arc, 140), 1, 360), R = num(a.range, 1.5) * s2;
    const pt = ang => [ex + Math.sin(ang * Math.PI / 180) * R, ey - ly - Math.cos(ang * Math.PI / 180) * R];
    const [x1, y1] = pt(-arc / 2), [x2, y2] = pt(arc / 2);
    g += arc >= 359 ? `<circle cx="${ex}" cy="${ey - ly}" r="${R}" fill="${c}" fill-opacity=".12" stroke="${c}"/>`
      : `<path d="M${ex},${ey - ly} L${x1},${y1} A${R},${R} 0 ${arc > 180 ? 1 : 0} 1 ${x2},${y2} Z" fill="${c}" fill-opacity=".12" stroke="${c}" stroke-width="1.4"/>`;
    g += T(x2 + 3, y2, String(i + 1), { size: 10, fill: c, weight: 600 });
  });
  g += `<rect x="${ex - size * s2 / 2}" y="${ey - size * s2 / 2}" width="${size * s2}" height="${size * s2}" fill="${col}" stroke="#00000033"/>`;
  g += `<rect x="10" y="10" width="${s2}" height="${s2}" fill="#b3b6bd" stroke="#7d818a"/>` + T(10 + s2 / 2, 10 + s2 + 12, 'игрок 1×1', { anchor: 'middle', size: 9 });
  // 3. Таймлайн атак
  const cd = num(e.attackCooldown, 0.8);
  const total = Math.max(0.1, ...attacks.map(a => enemyAttackTotal(a) + cd));
  const TW = 560, L = 64, R0 = 8, sx = (TW - L - R0) / total, rowH = 26;
  const phc = [C.yellow, C.red, C.orange, C.grid2];
  let tl = '';
  attacks.forEach((a, i) => {
    const y = 8 + i * rowH; let x = L;
    tl += T(4, y + 14, `${i + 1}. ${(ENEMY_MOTIONS.find(m => m[0] === a.motion) || [, a.motion])[0]}${a.combo?.length ? ` +${a.combo.length}` : ''}`, { size: 10, fill: C.dark });
    const steps = enemyAttackSteps(a);
    steps.forEach((s, j) => {
      const p = ph(s), last = j === steps.length - 1;
      const strikeX = x + p[0] * sx, pf = num(s.parryFrom, -0.18), pt2 = num(s.parryTo, 0.06);
      p.forEach((d, k) => { if (k === 3 && !last) return; if (d > 0) tl += `<rect x="${x}" y="${y}" width="${Math.max(1, d * sx - 1)}" height="18" fill="${phc[k]}" ${k === 1 ? '' : 'opacity=".75"'}/>`; x += d * sx; });
      if (pt2 > pf) tl += `<rect x="${strikeX + pf * sx}" y="${y - 2}" width="${(pt2 - pf) * sx}" height="22" fill="none" stroke="${C.lilac}" stroke-width="2" rx="2"/>`;
    });
    if (cd > 0) tl += `<rect x="${x}" y="${y + 5}" width="${cd * sx}" height="8" rx="3" fill="none" stroke="${C.grid2}" stroke-dasharray="2 2"/>`;
    tl += T(x + cd * sx + 3 > TW - 30 ? TW - 4 : x + cd * sx + 3, y + 13, `${r2(x / sx - L / sx + cd)} с`, { size: 9, anchor: x + cd * sx + 3 > TW - 30 ? 'end' : 'start' });
  });
  const tlH = 14 + attacks.length * rowH;
  // Сколько ударов нужно игроку
  const sameMul = num(S.files.Combat?.data?.sameColorMultiplier, 1.5), hp = Math.max(1, num(e.maxHealth, 40));
  const weapons = Object.entries(itemsData()).filter(([, it]) => it.combo?.length && num(it.damage) > 0);
  const killRows = weapons.map(([wid, it]) => {
    const mul = it.color && it.color === e.color ? sameMul : 1;
    let left = hp, n = 0; while (left > 0 && n < 999) { left -= itemDamage(it, it.combo[n % it.combo.length]) * mul; n++; }
    return `<tr><td><span class="swatch" style="background:${esc(colorHex(it.color))}"></span> ${esc(it.name || wid)}</td><td>${mul > 1 ? `×${r2(mul)} (тот же цвет)` : '—'}</td><td><b>${n >= 999 ? '∞' : n}</b></td></tr>`;
  }).join('');
  const wsum = attacks.reduce((x, a) => x + Math.max(0, num(a.weight, 1)), 0) || 1;
  const seriesDmg = a => enemyAttackSteps(a).reduce((x, s) => x + num(s.damage, 15), 0);
  const avgDmg = attacks.reduce((x, a) => x + seriesDmg(a) * Math.max(0, num(a.weight, 1)), 0) / wsum;
  const avgCycle = attacks.reduce((x, a) => x + (enemyAttackTotal(a) + cd) * Math.max(0, num(a.weight, 1)), 0) / wsum;
  const pr = S.files.Combat?.data?.poise || {}, poise = num(e.poise, 100), pHit = num(pr.hit, 25), pParry = num(pr.parry, 100);
  const poiseFact = poise <= 0 ? 'нет — не ошеломляется' : `${r2(poise, 0)}: ${pHit > 0 ? Math.ceil(poise / pHit) : '∞'} ударов или ${pParry > 0 ? Math.ceil(poise / pParry) : '∞'} парирований (множители оружия 1)`;
  const pWalk = num(S.files.Player?.data?.walkSpeed, 0), speed = num(e.moveSpeed, 4.5);
  const toFirst = num(e.alertDuration, 2) + Math.max(0, aggro - maxR) / Math.max(0.01, speed);
  const pHp = num(S.files.Player?.data?.health?.max, 0);
  return `<div style="display:flex;gap:10px;flex-wrap:wrap"><div><h4>Зоны сверху (масштаб по радиусу потери)</h4>${svgWrap(W, H, z)}</div><div><h4>Атаки сверху, цифры — номер атаки</h4>${svgWrap(W2, H2, g)}</div></div>`
    + `<h4>Атаки по времени</h4>${svgWrap(TW, tlH, tl)}<div class="legend">${legendItem(C.yellow, 'замах (реакция игрока)')}${legendItem(C.red, 'удар (урон)')}${legendItem(C.orange, 'фиксация')}${legendItem(C.grid2, 'возврат')}${legendItem(C.lilac, 'окно парирования', `border:2px solid ${C.lilac};height:6px`)}${legendItem(C.grid2, 'пауза между атаками', `border:1px dashed ${C.grid2};height:6px`)}</div>`
    + facts([
      ['Скорость', pWalk ? `${r2(speed)} бл/с (${r2(speed / pWalk * 100, 0)}% ходьбы игрока)` : `${r2(speed)} бл/с`],
      ['От агро до первого удара (агро 7)', `≈ ${r2(toFirst + (attacks[0] ? ph(attacks[0])[0] : 0), 1)} с`],
      ['Средний урон атаки', r2(avgDmg, 1)],
      ['Шкала выносливости', poiseFact],
      ['Урон в секунду в упор', r2(avgDmg / Math.max(0.01, avgCycle), 1)],
      ...(pHp ? [['Ударов до смерти игрока', String(Math.ceil(pHp / Math.max(0.01, avgDmg)))]] : []),
      ['Опыт', `${r2(num(e.experience, 10), 0)} (${r2(num(e.experiencePieces, 6), 0)} из ${r2(num(e.deathPieces, 14), 0)} осколков)`],
    ])
    + `<h4>Ударов игрока до победы (${r2(hp, 0)} ед. здоровья)</h4><table class="dmg"><tr><th>Оружие</th><th>Бонус цвета</th><th>Ударов</th></tr>${killRows || '<tr><td colspan="3">Нет оружия с уроном в Items.json</td></tr>'}</table>`;
}

/* =====================================================================
   Запуск
   ===================================================================== */
$('#btnOpen').onclick = pickDir;
$('#btnSaveAll').onclick = saveAll;
$('#fileInput').onchange = async e => {
  const list = [...e.target.files]; if (!list.length) return;
  S.files = {}; S.dir = null; S.mode = 'files';
  for (const file of list) addFile(file.name.replace(/\.json$/i, ''), await file.text(), null);
  S.current = firstFile(); renderAll(); e.target.value = '';
};
window.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveAll(); } });
window.addEventListener('beforeunload', e => { if (Object.keys(S.files).some(isDirty)) { e.preventDefault(); e.returnValue = ''; } });

(async function init() {
  renderAll();
  // Запомненная папка: браузер попросит подтвердить доступ одним нажатием.
  try {
    const dir = window.showDirectoryPicker && await IDB.get('dir');
    if (dir) {
      const b = $('#btnReopen'); b.style.display = ''; b.textContent = `Открыть снова: ${dir.name}`;
      b.onclick = async () => { try { if (await ensureWrite(dir)) { b.style.display = 'none'; await openDir(dir); } } catch (e) { toast('Папка недоступна: ' + e.message); } };
    }
  } catch { /* нет IndexedDB */ }
  // Если страницу отдаёт локальный сервер из корня проекта — подхватить конфиги для просмотра.
  if (location.protocol.startsWith('http')) {
    const base = new URL('../../Assets/StreamingAssets/Configs/', location.href);
    for (const n of FILE_ORDER) { try { const r = await fetch(new URL(n + '.json', base)); if (r.ok) addFile(n, await r.text(), null); } catch { } }
    if (Object.keys(S.files).length) { S.mode = 'fetch'; S.current = firstFile(); renderAll(); }
  }
})();
</script>
