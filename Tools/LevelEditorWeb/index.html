<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9ebee">
<meta name="mobile-web-app-capable" content="yes">
<title>ColorsAction — редактор уровней</title>
<style>
  :root {
    --bg: #e9ebee; --panel: #ffffff; --panel2: #f5f6f8; --line: #d9dce1; --line2: #c3c7ce;
    --text: #23262b; --muted: #6b7078; --faint: #9aa0a8;
    --accent: #2F6BFF; --accent-soft: #e4ebff; --ok: #3DBE5A; --warn: #E8913C; --bad: #E8413C;
    --cube: #c9ccd2; --cube-edge: #9ea2aa;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg);
         -webkit-user-select: none; user-select: none; }
  input, select, textarea { -webkit-user-select: text; user-select: text; }
  button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel);
           color: var(--text); cursor: pointer; white-space: nowrap; touch-action: manipulation; min-height: 36px; }
  button:active { background: var(--panel2); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.on { background: var(--accent-soft); border-color: var(--accent); color: #1b46b8; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .4; }
  .logo { width: 20px; height: 20px; background: var(--cube); border: 1px solid var(--cube-edge); border-radius: 4px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.08); flex: none; }

  #app { display: grid; grid-template-columns: 68px 1fr 300px; grid-template-rows: 54px 1fr; height: 100vh; height: 100dvh; }
  header { grid-column: 1 / 4; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
  header h1 { font-size: 15px; font-weight: 650; margin: 0 6px 0 2px; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  header .name { font-weight: 600; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  header .name b { color: var(--text); }
  header .grp { display: flex; gap: 6px; flex: none; }
  #saved { font-size: 12px; color: var(--faint); white-space: nowrap; }

  #tools { grid-row: 2; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding: 8px 6px; overflow-y: auto; }
  #tools button { width: 56px; height: 56px; padding: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10.5px; line-height: 1.05; white-space: normal; text-align: center; }
  #tools button .ic { font-size: 21px; line-height: 1; }
  #tools .sep { height: 1px; background: var(--line); margin: 4px 2px; flex: none; }

  #view { position: relative; overflow: hidden; touch-action: none; background: #dfe2e7; }
  #view canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #ov { pointer-events: none; }

  #floors { position: absolute; left: 10px; bottom: 10px; display: flex; flex-direction: column-reverse; gap: 4px; max-height: calc(100% - 80px); overflow-y: auto; }
  #floors button { min-width: 104px; text-align: left; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  #floors button small { color: var(--faint); margin-left: 4px; }
  #cam { position: absolute; right: 10px; bottom: 10px; display: grid; grid-template-columns: repeat(3, 48px); gap: 6px; }
  #cam button { height: 48px; padding: 0; font-size: 19px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  #cam button small { font-size: 10px; display: block; }
  #hud { position: absolute; left: 10px; top: 10px; background: rgba(255,255,255,.88); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12.5px; color: var(--muted); pointer-events: none; max-width: calc(100% - 20px); }
  #hud b { color: var(--text); }
  #toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: #23262b; color: #fff; padding: 8px 14px; border-radius: 9px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80%; text-align: center; }
  #toast.show { opacity: .94; }

  #panel { grid-row: 2; grid-column: 3; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 10px 12px 40px; -webkit-overflow-scrolling: touch; }
  #panel h3 { font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 6px; }
  #panel h3:first-child { margin-top: 2px; }
  #panel .desc { color: var(--muted); font-size: 12.5px; margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chips button { min-width: 40px; padding: 6px 9px; }
  .chips.big button { min-width: 44px; min-height: 44px; font-size: 15px; font-weight: 600; }
  .swatch { width: 38px; height: 38px; border-radius: 8px; border: 2px solid transparent; padding: 0; min-height: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .swatch.on { border-color: var(--text); box-shadow: inset 0 0 0 2px #fff; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { flex: 1; color: var(--muted); font-size: 13px; }
  .row input[type=text], .row input[type=number], .row select { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line2); border-radius: 7px; background: #fff; color: var(--text); width: 150px; min-height: 36px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 44px; height: 44px; font-size: 20px; padding: 0; }
  .stepper .val { min-width: 54px; text-align: center; font-size: 22px; font-weight: 700; }
  .shape-ic { display: inline-block; width: 22px; height: 16px; vertical-align: middle; }
  .list { display: flex; flex-direction: column; gap: 4px; }
  .list button { text-align: left; display: flex; gap: 8px; align-items: center; }
  .list button .mk { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; flex: none; }
  .note { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .warn { background: #fdecea; color: #a12a25; border-color: #f3c2bf; }

  .modal-back { position: fixed; inset: 0; background: rgba(20,22,26,.35); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .modal { background: var(--panel); border-radius: 14px; padding: 18px 20px; width: min(460px, 100%); max-height: 90vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .modal h2 { margin: 0 0 10px; font-size: 18px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .modal .menu { display: flex; flex-direction: column; gap: 6px; }
  .modal .menu button { text-align: left; min-height: 46px; font-size: 14.5px; }
  .modal .menu button small { display: block; color: var(--muted); font-size: 12px; white-space: normal; }
  .hidden { display: none !important; }

  @media (max-width: 820px), (orientation: portrait) and (max-width: 1100px) {
    #app { grid-template-columns: 68px 1fr; grid-template-rows: 54px 1fr 38vh; }
    header { grid-column: 1 / 3; }
    #tools { grid-row: 2 / 4; }
    #panel { grid-row: 3; grid-column: 2; border-left: 0; border-top: 1px solid var(--line); }
    header h1 span.t { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="logo"></span><span class="t">Уровни</span></h1>
    <div class="grp">
      <button id="bFile">☰ Файл</button>
      <button id="bUndo" title="Отменить">↶</button>
      <button id="bRedo" title="Повторить">↷</button>
    </div>
    <div class="name" id="levelName"></div>
    <span id="saved"></span>
    <div class="grp"><button id="bSave" class="primary">⤓ Сохранить</button></div>
  </header>

  <div id="tools"></div>

  <div id="view">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div id="hud"></div>
    <div id="toast"></div>
    <div id="floors"></div>
    <div id="cam">
      <button id="cRotL" title="Повернуть влево">⟲</button>
      <button id="cMode" title="Вид сверху / изометрия"><small>вид</small>⬒</button>
      <button id="cRotR" title="Повернуть вправо">⟳</button>
      <button id="cOut" title="Отдалить">−</button>
      <button id="cFit" title="Показать весь уровень">⌂</button>
      <button id="cIn" title="Приблизить">+</button>
    </div>
  </div>

  <div id="panel"></div>
</div>
<input type="file" id="fileInput" accept=".json,application/json" class="hidden">

<script src="three.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
// ============================================================================ данные игры (запасные, если конфиги не загрузились)

let PALETTE = {
  blue:   { name: 'Синий',        hex: '#2F6BFF' },
  lilac:  { name: 'Сиреневый',    hex: '#B07CFF' },
  red:    { name: 'Красный',      hex: '#E8413C' },
  yellow: { name: 'Жёлтый',       hex: '#F5C518' },
  green:  { name: 'Зелёный',      hex: '#3DBE5A' },
  orange: { name: 'Оранжевый',    hex: '#FF8A1F' },
  teal:   { name: 'Сине-зелёный', hex: '#18B5A8' },
};
let ITEMS = ['sword', 'shield', 'fists'];
// Типы врагов из Enemies.json: id → имя и цвет. Манекен — отдельный тип прототипа.
let ENEMY_INFO = { club_cube: { name: 'Куб с дубиной', color: 'blue' }, dummy: { name: 'Манекен', color: null } };
let ENEMIES = Object.keys(ENEMY_INFO);
const HINTS = ['interact', 'jump', 'roll', 'inventory', 'attack', 'block', 'run'];
const WORLD_COLOR = '#e4e5e9';

const SHAPES = {
  F: { name: 'Куб' }, H: { name: 'Полублок' }, S: { name: 'Ступенька' },
  L: { name: 'Слоп' }, T: { name: 'Верх слопа' }, X: { name: 'Крутой слоп' }, D: { name: 'Декор' },
};
const TOP_SHAPES = [
  ['', 'нет'], ['H', '½'], ['S', '¼'], ['L', 'слоп'], ['T', 'верх слопа'], ['X', 'крутой'], ['D', 'декор'],
];
const OBJECT_KINDS = {
  PlayerSpawn:    { name: 'Старт игрока',   mk: '★', col: '#23262b' },
  Barrier:        { name: 'Цветной барьер', mk: '▮', col: '#E8413C' },
  WeaponPedestal: { name: 'Оружие',         mk: '⚔', col: '#2F6BFF' },
  Bonfire:        { name: 'Костёр',         mk: '♨', col: '#FF8A1F' },
  EnemySpawn:     { name: 'Враг',           mk: '☗', col: '#7a1f1c' },
  Npc:            { name: 'NPC',            mk: '☺', col: '#3DBE5A' },
  Hint:           { name: 'Подсказка',      mk: '?', col: '#6b7078' },
  ShortcutDoor:   { name: 'Дверь-срезка',   mk: '⊓', col: '#9a6a3f' },
};
// Сторона, с которой открывается дверь-срезка (= её поворот, как в Unity: 0° — +Z).
const DOOR_SIDES = [[0, '↑ +Z'], [90, '→ +X'], [180, '↓ −Z'], [270, '← −X']];
function doorSide(yaw) { return (((Math.round((yaw || 0) / 90) % 4) + 4) % 4) * 90; }
const BARRIERS = { Wall: 'Стена', Crate: 'Ящик', Membrane: 'Мембрана', Grate: 'Решётка' };
const ACTIONS = {
  ShieldSlide:     { name: 'Спуск на щите',  link: true },
  Lift:            { name: 'Лифт',           link: true },
  GrappleAnchor:   { name: 'Якорь крюка',    link: true },
  FlailRing:       { name: 'Кольцо кистеня', link: true },
  Lever:           { name: 'Рычаг',          link: false },
  ShortcutDoor:    { name: 'Дверь-срезка',   link: true },
  FloorTransition: { name: 'Переход этажа',  link: true },
};
const ACTION_DEFAULTS = {
  ShieldSlide: { requiredItem: 'shield' }, GrappleAnchor: { requiredItem: 'hook' }, FlailRing: { requiredItem: 'flail' },
  Lift: { twoWay: true }, FloorTransition: { twoWay: true }, ShortcutDoor: { twoWay: true },
};

// ============================================================================ геометрия блоков (как BlockShapes в Unity)

function centerTop(s) { return s === 'F' ? 1 : s === 'H' ? .5 : s === 'S' ? .25 : s === 'D' ? 0 : s === 'L' ? .25 : s === 'T' ? .75 : .5; }
function slopeRange(s) { return s === 'L' ? [0, .5] : s === 'T' ? [.5, 1] : s === 'X' ? [0, 1] : null; }
function isSlope(s) { return s === 'L' || s === 'T' || s === 'X'; }
function isSolid(s) { return s !== 'D'; }
function smoothable(s) { return s === 'F' || s === 'H' || s === 'S'; }
function topAt(s, r, u, v) {
  const sr = slopeRange(s);
  if (!sr) return centerTop(s);
  const t = [v, u, 1 - v, 1 - u][r & 3];
  return sr[0] + (sr[1] - sr[0]) * t;
}
const RISE = [[0, 1], [1, 0], [0, -1], [-1, 0]];

// ============================================================================ уровень

const K = (x, y, z) => x + ',' + y + ',' + z;
const P = k => k.split(',').map(Number);

const L = {
  name: 'Новый уровень', file: 'NewLevel',
  floors: [{ id: 'f0', name: 'Этаж 0', baseY: 0 }],
  blocks: new Map(), // "x,y,z" -> {s, r, c}
  objects: [], points: [],
};

function floorIndexOf(y) { let i = 0; L.floors.forEach((f, n) => { if (f.baseY <= y) i = n; }); return i; }
function floorRange(i) {
  return [i === 0 ? -Infinity : L.floors[i].baseY, i + 1 < L.floors.length ? L.floors[i + 1].baseY : Infinity];
}
function getB(x, y, z) { return L.blocks.get(K(x, y, z)); }
function solidAt(x, y, z) { const b = getB(x, y, z); return !!b && isSolid(b.s); }
function fullAt(x, y, z) { const b = getB(x, y, z); return !!b && b.s === 'F'; }

let bounds = { minY: -1, maxY: 1, minX: 0, maxX: 31, minZ: 0, maxZ: 31 };
function computeBounds() {
  let a = { minY: Infinity, maxY: -Infinity, minX: Infinity, maxX: -Infinity, minZ: Infinity, maxZ: -Infinity };
  for (const k of L.blocks.keys()) {
    const [x, y, z] = P(k);
    if (x < a.minX) a.minX = x; if (x > a.maxX) a.maxX = x;
    if (y < a.minY) a.minY = y; if (y > a.maxY) a.maxY = y;
    if (z < a.minZ) a.minZ = z; if (z > a.maxZ) a.maxZ = z;
  }
  if (a.minX === Infinity) a = { minY: -1, maxY: 1, minX: 0, maxX: 15, minZ: 0, maxZ: 15 };
  bounds = a;
}

/** Верхний блок столбца в пределах этажа. */
function columnTop(x, z, fi) {
  const [lo, hi] = floorRange(fi);
  const top = Math.min(hi - 1, bounds.maxY + 1), bottom = Math.max(lo, bounds.minY - 1);
  for (let y = top; y >= bottom; y--) { const b = getB(x, y, z); if (b) return { y, b }; }
  return null;
}
/** Клетка, где стоит объект (над опорой; неполный блок — в своей клетке), как PlacementCell в Unity. */
function standCell(x, z, fi) {
  const t = columnTop(x, z, fi);
  if (!t) return [x, fi === 0 ? 0 : L.floors[fi].baseY, z];
  return [x, t.b.s === 'F' || t.b.s === 'D' ? t.y + 1 : t.y, z];
}
function surfaceOf(cell) {
  const [x, y, z] = cell; const b = getB(x, y, z);
  return b && isSolid(b.s) ? y + centerTop(b.s) : y;
}

// ------------------------------------------------------------------ сглаживание перепадов до 0.3 (SurfaceSmoothing)
const MAX_STEP = 0.3, EPS = 1e-4;
function smoothRaise(x, y, z, own) {
  let best = own;
  for (let dy = 0; dy <= 1; dy++) {
    const b = getB(x, y + dy, z);
    if (!b || !smoothable(b.s) || solidAt(x, y + dy + 1, z)) continue;
    const top = y + dy + centerTop(b.s);
    if (top > own + EPS && top <= own + MAX_STEP + EPS && top > best) best = top;
  }
  return best;
}
function smoothCorners(x, y, z, b) {
  if (!smoothable(b.s) || solidAt(x, y + 1, z)) return null;
  const own = y + centerTop(b.s);
  const c = (sx, sz) => Math.max(own, smoothRaise(x + sx, y, z, own), smoothRaise(x, y, z + sz, own), smoothRaise(x + sx, y, z + sz, own));
  const r = [c(-1, -1), c(-1, 1), c(1, 1), c(1, -1)];
  return Math.max(...r) > own + EPS ? r.map(h => h - y) : null;
}

// ============================================================================ правки и история

const undoStack = [], redoStack = [];
let tx = null;
function begin() { if (!tx) tx = { blocks: new Map(), markup: null }; }
function setBlock(x, y, z, v) {
  begin();
  const k = K(x, y, z), old = L.blocks.get(k) || null;
  if (!old && !v) return;
  if (old && v && old.s === v.s && (old.r | 0) === (v.r | 0) && (old.c || null) === (v.c || null)) return;
  if (!tx.blocks.has(k)) tx.blocks.set(k, old);
  if (v) L.blocks.set(k, { s: v.s, r: v.r | 0, c: v.c || null }); else L.blocks.delete(k);
  markDirty(x, y, z);
}
function snapMarkup() { return JSON.stringify({ floors: L.floors, objects: L.objects, points: L.points }); }
function loadMarkup(s) { const m = JSON.parse(s); L.floors = m.floors; L.objects = m.objects; L.points = m.points; }
function touchMarkup() { begin(); if (tx.markup == null) tx.markup = snapMarkup(); }
function commit() {
  if (!tx) return;
  const e = { blocks: [], markupBefore: tx.markup, markupAfter: tx.markup != null ? snapMarkup() : null };
  for (const [k, before] of tx.blocks) {
    const after = L.blocks.get(k) || null;
    e.blocks.push([k, before, after]);
  }
  tx = null;
  if (!e.blocks.length && (e.markupBefore == null || e.markupBefore === e.markupAfter)) return;
  undoStack.push(e); if (undoStack.length > 300) undoStack.shift();
  redoStack.length = 0;
  changed();
}
function rollback() {
  if (!tx) return;
  for (const [k, before] of tx.blocks) { if (before) L.blocks.set(k, before); else L.blocks.delete(k); markDirty(...P(k)); }
  if (tx.markup != null) loadMarkup(tx.markup);
  tx = null; changed(true);
}
function applyEntry(e, back) {
  for (const [k, before, after] of e.blocks) {
    const v = back ? before : after;
    if (v) L.blocks.set(k, v); else L.blocks.delete(k);
    markDirty(...P(k));
  }
  const m = back ? e.markupBefore : e.markupAfter;
  if (m != null) loadMarkup(m);
}
function undo() { if (tx) return; const e = undoStack.pop(); if (!e) return; applyEntry(e, true); redoStack.push(e); fixSelection(); changed(); }
function redo() { if (tx) return; const e = redoStack.pop(); if (!e) return; applyEntry(e, false); undoStack.push(e); fixSelection(); changed(); }
function fixSelection() {
  if (sel.obj && !L.objects.find(o => o.id === sel.obj)) sel.obj = null;
  if (sel.point && !L.points.find(p => p.id === sel.point)) sel.point = null;
  if (activeFloor >= L.floors.length) activeFloor = L.floors.length - 1;
}

let saveTimer = null, savedAt = null, lastFloorsSig = '', needMarkers = true;
function changed(silent) {
  const fs = L.floors.map(f => f.baseY).join(',');
  if (fs !== lastFloorsSig) { lastFloorsSig = fs; needMesh = true; }
  computeBounds();
  needMarkers = true;
  requestRender();
  updateUndoButtons();
  renderFloors();
  if (!silent) { clearTimeout(saveTimer); saveTimer = setTimeout(autosave, 600); }
  refreshPanelSoft();
}

// ============================================================================ формат файла (VoxelLevelData)

function newId(prefix, list) { const set = new Set(list.map(o => o.id)); for (let i = 1; ; i++) if (!set.has(prefix + i)) return prefix + i; }
const cellStr = c => c.join(',');
const parseCell = s => String(s).split(',').map(v => parseInt(v.trim(), 10));

function toJSON() {
  const keys = [...L.blocks.keys()].map(k => [k, P(k)]);
  keys.sort((a, b) => a[1][1] - b[1][1] || a[1][2] - b[1][2] || a[1][0] - b[1][0]);
  const clean = o => { const r = {}; for (const [k, v] of Object.entries(o)) if (v !== null && v !== undefined && v !== '' && v !== false) r[k] = v; return r; };
  return {
    format: 1,
    name: L.name,
    floors: L.floors.map(f => clean({ id: f.id, name: f.name, baseY: f.baseY || undefined })),
    blocks: keys.map(([k, [x, y, z]]) => { const b = L.blocks.get(k); return `${x},${y},${z},${b.s},${b.r | 0}` + (b.c ? ',' + b.c : ''); }),
    objects: L.objects.map(o => clean({
      id: o.id, kind: o.kind, cell: cellStr(o.cell), yaw: o.yaw || undefined, color: o.color,
      barrier: o.kind === 'Barrier' && o.barrier && o.barrier !== 'Wall' ? o.barrier : undefined,
      height: o.height ?? 2, item: o.item,
    })),
    points: L.points.map(p => clean({

function fileNameFrom(s) {
  const tr = { а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ы:'y',э:'e',ю:'yu',я:'ya' };

const glCanvas = $('#gl'), ov = $('#ov'), octx = ov.getContext('2d');

const MAT = {

// Меши кусками 16×16 клеток на этаж, как в Unity: при рисовании пересобираются только изменённые куски.
const CH = 16;
let chunks = new Map(); // "cx,cz,floor" -> {mesh, tri: [ключи блоков], floor, labels: Map}
let dirtyChunks = new Set();
let needMesh = true; // полная пересборка

const cam = { tx: 16, ty: 0, tz: 16, yaw: 45, yawT: 45, pitch: 35.26, pitchT: 35.26, zoom: 14, snap: true };

function heightColor(absTop) {
  const base = activeFloor === 0 ? 0 : L.floors[activeFloor].baseY;
  const t = Math.max(0, Math.min(1, (absTop - base) / 8));
  const c = new THREE.Color(); c.setHSL((215 - 215 * t) / 360, 0.55, 0.66 - 0.06 * Math.sin(t * Math.PI));
  return c;
}
function heightCss(absTop) { return '#' + heightColor(absTop).getHexString(); }

function chunkKey(x, y, z) { return Math.floor(x / CH) + ',' + Math.floor(z / CH) + ',' + floorIndexOf(y); }
function markDirty(x, y, z) {
  if (needMesh) return;
  for (let dy = -2; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) dirtyChunks.add(chunkKey(x + dx, y + dy, z + dz));
}
function dropChunk(ck) { const c = chunks.get(ck); if (c) { if (c.mesh) { c.mesh.geometry.dispose(); root.remove(c.mesh); } chunks.delete(ck); } }
function buildMeshes() {
  const full = needMesh;
  let keys;
  if (full) { for (const ck of [...chunks.keys()]) dropChunk(ck); keys = null; }
  else { if (!dirtyChunks.size) return; keys = dirtyChunks; for (const ck of keys) dropChunk(ck); }
  const per = new Map();
  for (const [k, b] of L.blocks) {
    const [x, y, z] = P(k); const ck = chunkKey(x, y, z);
    if (keys && !keys.has(ck)) continue;
    let g = per.get(ck); if (!g) per.set(ck, g = { pos: [], col: [], tri: [], labels: new Map(), floor: floorIndexOf(y), list: [] });
    g.list.push([k, b, x, y, z]);
  }
  dirtyChunks = new Set();
  const world = new THREE.Color(WORLD_COLOR);
  const pal = {}; for (const [k, v] of Object.entries(PALETTE)) pal[k] = new THREE.Color(v.hex);
  const tmp = new THREE.Color();
  for (const g of per.values()) for (const [k, b, x, y, z] of g.list) {
    const fi = g.floor, labelCols = g.labels;
    const same = (xx, yy, zz) => floorIndexOf(yy) === fi;
    const occl = (xx, yy, zz) => fullAt(xx, yy, zz) && same(xx, yy, zz);
    let base = b.c && pal[b.c] ? pal[b.c] : world;
    // высота углов верха
    let c;
    if (b.s === 'D') c = null;
    else if (isSlope(b.s)) c = [topAt(b.s, b.r, 0, 0), topAt(b.s, b.r, 0, 1), topAt(b.s, b.r, 1, 1), topAt(b.s, b.r, 1, 0)];
    else c = (st.smoothing && smoothCorners(x, y, z, b)) || [centerTop(b.s), centerTop(b.s), centerTop(b.s), centerTop(b.s)];
    let topCol = base;
    const visibleTop = !solidAt(x, y + 1, z) || !same(x, y + 1, z);
    if (st.heightTint && !b.c && fi === activeFloor) topCol = heightColor(y + centerTop(b.s));
    if (fi === activeFloor && b.s !== 'D') {
      const ck = x + ',' + z, prev = labelCols.get(ck);
      if (!prev || prev.y < y) labelCols.set(ck, { y, b, top: y + (c ? Math.max(...c) : 0) });
    }
    const push = (pts, color) => { // pts: 3 vertices
      for (const p of pts) { g.pos.push(p[0], p[1], p[2]); g.col.push(color.r, color.g, color.b); }
      g.tri.push(k);
    };
    const quad = (a, b2, c2, d, color) => { push([a, b2, c2], color); push([a, c2, d], color); };
    if (b.s === 'D') {
      const i0 = 0.2, i1 = 0.8, hh = 0.6;
      const x0 = x + i0, x1 = x + i1, z0 = z + i0, z1 = z + i1, y0 = y, y1 = y + hh;
      tmp.copy(base).multiplyScalar(0.9);
      quad([x0, y1, z0], [x0, y1, z1], [x1, y1, z1], [x1, y1, z0], base);
      quad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], tmp);
      quad([x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], tmp);
      quad([x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], tmp);
      quad([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], tmp);
      continue;
    }
    const [c00, c01, c11, c10] = c;
    const X0 = x, X1 = x + 1, Z0 = z, Z1 = z + 1, Y = y;
    if (visibleTop || Math.min(...c) < 1) {
      // верх: (x0,z0) (x0,z1) (x1,z1) (x1,z0) против часовой сверху
      quad([X0, Y + c00, Z0], [X0, Y + c01, Z1], [X1, Y + c11, Z1], [X1, Y + c10, Z0], topCol);
    }
    const side = base;
    if (!occl(x - 1, y, z) && (c00 > 0 || c01 > 0)) quad([X0, Y, Z0], [X0, Y, Z1], [X0, Y + c01, Z1], [X0, Y + c00, Z0], side);
    if (!occl(x + 1, y, z) && (c10 > 0 || c11 > 0)) quad([X1, Y, Z1], [X1, Y, Z0], [X1, Y + c10, Z0], [X1, Y + c11, Z1], side);
    if (!occl(x, y, z - 1) && (c00 > 0 || c10 > 0)) quad([X1, Y, Z0], [X0, Y, Z0], [X0, Y + c00, Z0], [X1, Y + c10, Z0], side);
    if (!occl(x, y, z + 1) && (c01 > 0 || c11 > 0)) quad([X0, Y, Z1], [X1, Y, Z1], [X1, Y + c11, Z1], [X0, Y + c01, Z1], side);
  }
  per.forEach((g, ck) => {
    const fi = g.floor;
    if (!g.pos.length) { chunks.set(ck, { mesh: null, tri: [], floor: fi, labels: g.labels }); return; }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(g.pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(g.col, 3));
    geo.computeVertexNormals();
    let mat = MAT.normal, visible = true;
    if (fi > activeFloor) { if (st.upper === 'hide') visible = false; else if (st.upper === 'ghost') mat = MAT.ghost; }
    else if (fi < activeFloor && st.darkBelow) mat = MAT.dark;
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = visible;
    mesh.renderOrder = mat === MAT.ghost ? 2 : 0;
    root.add(mesh);
    chunks.set(ck, { mesh, tri: g.tri, floor: fi, labels: g.labels });
  });
  buildMarkers();
  if (full) buildGrid();
  needMesh = false;
}

// барьеры — полупрозрачные цветные коробки
let markerGroup = new THREE.Group(); root.add(markerGroup);
function buildMarkers() {
  needMarkers = false;
  markerGroup.children.forEach(c => { c.geometry.dispose(); c.material.dispose(); });
  markerGroup.clear();
  for (const o of L.objects) {
    if (o.kind === 'ShortcutDoor') { addDoorMesh(o); continue; }
    if (o.kind !== 'Barrier') continue;
    const hgt = Math.max(1, o.height ?? 2);
    const col = new THREE.Color(PALETTE[o.color]?.hex || '#999');
    const fi = floorIndexOf(o.cell[1]);
    const hidden = fi > activeFloor && st.upper === 'hide';
    const geo = new THREE.BoxGeometry(o.barrier === 'Membrane' ? 0.2 : 0.96, hgt, o.barrier === 'Membrane' ? 0.96 : 0.96);
    const mat = new THREE.MeshLambertMaterial({ color: col, transparent: true, opacity: fi > activeFloor ? 0.2 : (o.barrier === 'Grate' ? 0.45 : 0.72), depthWrite: false });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(o.cell[0] + .5, surfaceOf(o.cell) + hgt / 2, o.cell[2] + .5);
    m.rotation.y = -(o.yaw || 0) * Math.PI / 180;
    m.visible = !hidden; m.renderOrder = 3;
    markerGroup.add(m);
  }
}
// Дверь-срезка: плита поперёк клетки (тонкая вдоль лицевой стороны) и засов на лицевой стороне.
function addDoorMesh(o) {
  const hgt = Math.max(1, o.height ?? 3);
  const fi = floorIndexOf(o.cell[1]);
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: OBJECT_KINDS.ShortcutDoor.col, transparent: true, opacity: fi > activeFloor ? 0.2 : 0.8, depthWrite: false });
  const slab = new THREE.Mesh(new THREE.BoxGeometry(0.96, hgt, 0.3), mat);
  slab.position.y = hgt / 2;
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.14, 0.12), new THREE.MeshLambertMaterial({ color: '#ffd34d' }));
  bar.position.set(0, Math.min(1.1, hgt - 0.2), 0.21);
  g.position.set(o.cell[0] + .5, surfaceOf(o.cell), o.cell[2] + .5);
  g.rotation.y = (o.yaw || 0) * Math.PI / 180;
  g.visible = !(fi > activeFloor && st.upper === 'hide');
  slab.renderOrder = 3; bar.renderOrder = 3;
  markerGroup.add(slab, bar);
  // Меши переносим в мировые координаты: очистка markerGroup ожидает у детей geometry/material.
  g.updateMatrixWorld(true);
  for (const m of [slab, bar]) { m.applyMatrix4(g.matrixWorld); m.visible = g.visible; }
}
let grid = null;
function buildGrid() {
  if (grid) { grid.geometry.dispose(); root.remove(grid); }
  const pts = [];
  const x0 = bounds.minX - 4, x1 = bounds.maxX + 5, z0 = bounds.minZ - 4, z1 = bounds.maxZ + 5;
  const y = (activeFloor === 0 ? 0 : L.floors[activeFloor].baseY) + 0.003;
  for (let x = x0; x <= x1; x++) pts.push(x, y, z0, x, y, z1);
  for (let z = z0; z <= z1; z++) pts.push(x0, y, z, x1, y, z);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  grid = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0x9aa0a8, transparent: true, opacity: 0.35, depthWrite: false }));
  grid.renderOrder = 1;
  root.add(grid);

    else { cam.yawT -= dx * 0.4; cam.yaw = cam.yawT; cam.pitchT = Math.max(15, Math.min(90, cam.pitchT + dy * 0.3)); cam.pitch = cam.pitchT; gesture.rot = true; requestRender(); }
    return;
  }
  if (stroke && stroke.id === e.pointerId) {
    if (!stroke.started) {
      if (Math.hypot(e.clientX - stroke.x0, e.clientY - stroke.y0) > 8) { clearTimeout(stroke.timer); startStroke(stroke.x0, stroke.y0); }
      else return;
    }
    // промежуточные точки, чтобы быстрый штрих не пропускал клетки
    const coalesced = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ce of (coalesced.length ? coalesced : [e])) continueStroke(ce.clientX, ce.clientY);
  }
  hover(e.clientX, e.clientY);
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (gesture && gesture.two) { if (pointers.size < 2) endGesture(); return; }
  if (gesture && pointers.size === 0) { if (gesture.mouse === 2 && gesture.rot && cam.snap) snapYaw(); gesture = null; return; }
  if (stroke && stroke.id === e.pointerId) {
    clearTimeout(stroke.timer);
    if (!stroke.started && e.type !== 'pointercancel') startStroke(stroke.x0, stroke.y0);
    finishStroke(e.type === 'pointercancel');
  }
}
view.addEventListener('pointerup', endPointer);
view.addEventListener('pointercancel', endPointer);
view.addEventListener('contextmenu', e => e.preventDefault());
view.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });

function startStroke(px, py) {
  stroke.started = true;
  const t = st.tool;
  if (t === 'column' || t === 'erase') {
    const c = pickColumn(px, py); if (!c) return;
    stroke.planeY = c.y;
    strokeCells(c.xz);
  } else if (t === 'rect') {
    const c = pickColumn(px, py); if (!c) return;
    stroke.planeY = c.y;
    rectDrag = { a: c.xz, b: c.xz, y: c.y + 0.02 };
  } else if (t === 'paint') { paintAt(px, py); }
  else if (t === 'block') { blockAt(px, py); stroke.once = true; }
  else if (t === 'pick') { pickAt(px, py); }
  else if (t === 'object') { const o = objectTap(px, py); if (o) dragObj = { o, moved: false }; }
  else if (t === 'point') { const p = pointTap(px, py); if (p) dragObj = { o: p, moved: false, point: true }; }
  requestRender();
}
function continueStroke(px, py) {
  const t = st.tool;
  if (t === 'column' || t === 'erase') {
    const xz = planeHit(px, py, stroke.planeY); if (xz) strokeCells(xz);
  } else if (t === 'rect') {
    if (!rectDrag) return; const xz = planeHit(px, py, stroke.planeY); if (xz) { rectDrag.b = xz; requestRender(); }
  } else if (t === 'paint') paintAt(px, py);
  else if ((t === 'object' || t === 'point') && dragObj) {
    const c = pickColumn(px, py); if (!c) return;
    const cell = standCell(c.xz[0], c.xz[1], activeFloor);
    if (cellStr(cell) !== cellStr(dragObj.o.cell)) { touchMarkup(); dragObj.o.cell = cell; dragObj.moved = true; requestRender(); }
  }
  requestRender();
}
function strokeCells(xz) {
  // соединяем клетки линией (алгоритм Брезенхэма), чтобы не было дыр
  const last = stroke.last || xz;
  let [x0, z0] = last; const [x1, z1] = xz;
  const dx = Math.abs(x1 - x0), dz = Math.abs(z1 - z0), sx = x0 < x1 ? 1 : -1, sz = z0 < z1 ? 1 : -1;
  let err = dx - dz;
  for (let guard = 0; guard < 500; guard++) {
    for (const [cx, cz] of brushCells(x0, z0, st.tool === 'column' || st.tool === 'erase' ? st.brush : 1)) {
      const k = cx + ',' + cz; if (stroke.cells.has(k)) continue; stroke.cells.add(k);
      if (st.tool === 'erase') eraseColumn(cx, cz); else applyColumn(cx, cz);
    }
    if (x0 === x1 && z0 === z1) break;
    const e2 = 2 * err;
    if (e2 > -dz) { err -= dz; x0 += sx; }
    if (e2 < dx) { err += dx; z0 += sz; }
  }
  stroke.last = xz;
  computeBounds();
}
function finishStroke(cancel) {
  if (cancel) { rollback(); stroke = null; rectDrag = null; dragObj = null; requestRender(); return; }
  if (st.tool === 'rect' && rectDrag) {
    const [ax, az] = rectDrag.a, [bx, bz] = rectDrag.b;
    const n = (Math.abs(ax - bx) + 1) * (Math.abs(az - bz) + 1);
    if (n <= 65536) for (let z = Math.min(az, bz); z <= Math.max(az, bz); z++) for (let x = Math.min(ax, bx); x <= Math.max(ax, bx); x++) applyColumn(x, z);
    rectDrag = null;
  }
  if (dragObj && dragObj.moved && dragObj.point === undefined) { /* объект перенесён */ }
  dragObj = null;
  stroke = null;
  commit();
  hud(); requestRender();
}
function hover(px, py) {
  if (pointers.size > 0 && !stroke) return;
  if (!['column', 'rect', 'erase', 'paint', 'pick', 'block', 'object', 'point'].includes(st.tool)) { cursor.visible = false; hoverInfo = ''; hud(); return; }
  const c = pickColumn(px, py);
  if (!c) { cursor.visible = false; hoverInfo = ''; hud(); requestRender(); return; }
  const [x, z] = c.xz; const t = columnTop(x, z, activeFloor);
  const base = floorPlaneY();
  const top = t ? t.y + centerTop(t.b.s) : base;
  cursor.position.set(x + .5, (t ? t.y : base) + .5, z + .5); cursor.visible = true;
  hoverInfo = `x ${x}, z ${z}, верх ${t ? fmtH(top - base) : '—'}`;
  hud(); requestRender();
}

function startGesture() {
  const ps = [...pointers.values()].slice(0, 2);
  gesture = { two: true, start: ps.map(p => ({ ...p })), cam: { ...cam }, last: twoState(ps) };
}
function twoState(ps) {
  const [a, b] = ps;
  return { mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y), ang: Math.atan2(b.y - a.y, b.x - a.x) };
}
function moveGesture() {
  const ps = [...pointers.values()].slice(0, 2); if (ps.length < 2) return;
  const s = twoState(ps), l = gesture.last;
  panBy(s.mx - l.mx, s.my - l.my);
  if (l.d > 10 && s.d > 10) zoomAt(l.d / s.d, s.mx, s.my);
  let da = s.ang - l.ang; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
  cam.yawT += da * 180 / Math.PI; cam.yaw = cam.yawT; gesture.rotated = (gesture.rotated || 0) + Math.abs(da);
  gesture.last = s; requestRender();
}
function endGesture() {
  if (cam.snap && gesture.rotated) snapYaw();
  gesture = null;
  // оставшийся палец ничего не рисует до следующего касания
  for (const id of pointers.keys()) pointers.delete(id);
}
function snapYaw() { cam.yawT = Math.round((cam.yawT - 45) / 90) * 90 + 45; requestRender(); }
/** Точка на горизонтальной плоскости через цель камеры под экранной точкой (в координатах окна). */
function groundAt(px, py) {
  const ray = rayAt(px, py);
  if (Math.abs(ray.direction.y) < 1e-4) return null;
  const t = (cam.ty - ray.origin.y) / ray.direction.y;
  return ray.origin.clone().addScaledVector(ray.direction, t);
}
function panBy(dx, dy) {
  updateCamera();
  const r = glCanvas.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const a = groundAt(cx, cy), b = groundAt(cx + dx, cy + dy);
  if (!a || !b) return;
  cam.tx -= b.x - a.x; cam.tz -= b.z - a.z;
  requestRender();
}
function zoomAt(f, px, py) {
  updateCamera();
  const a = px !== undefined ? groundAt(px, py) : null;
  cam.zoom = Math.max(2, Math.min(200, cam.zoom * f));
  if (a) { updateCamera(); const b = groundAt(px, py); if (b) { cam.tx += a.x - b.x; cam.tz += a.z - b.z; } }
  requestRender();
}

// ------------------------------------------------------------------ клавиатура (если планшет с клавиатурой или ПК)
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); download(); return; }
  if (e.key === 'q' || e.key === 'Q' || e.key === 'й') rotateCam(-1);
  if (e.key === 'e' || e.key === 'E' || e.key === 'у') rotateCam(1);
  if (e.key >= '0' && e.key <= '9') { st.height = +e.key; renderPanel(); hud(); }
  if (e.key === 'Delete' && sel.obj) { touchMarkup(); L.objects = L.objects.filter(o => o.id !== sel.obj); sel.obj = null; commit(); renderPanel(); }
});
function rotateCam(dir) { cam.yawT = (cam.snap ? Math.round((cam.yawT - 45) / 90) * 90 + 45 : cam.yawT) + dir * 90; requestRender(); }

// ============================================================================ кнопки

$('#bFile').onclick = fileMenu;
$('#bSave').onclick = download;
$('#bUndo').onclick = undo;
$('#bRedo').onclick = redo;
$('#cRotL').onclick = () => rotateCam(-1);
$('#cRotR').onclick = () => rotateCam(1);
$('#cMode').onclick = () => { cam.pitchT = cam.pitchT > 80 ? 35.26 : 90; if (st.tool === 'view') renderPanel(); requestRender(); };
$('#cIn').onclick = () => zoomAt(1 / 1.3);
$('#cOut').onclick = () => zoomAt(1.3);
$('#cFit').onclick = fitView;

// ============================================================================ старт

renderTools();
if (!restore()) newLevel(32, 32, 'Новый уровень');
renderName(); renderFloors(); renderPanel(); updateUndoButtons(); hud();
resize(); fitView();
loadSiteData();
window.__editor = { L, st, cam, toJSON, fromJSON, undo, redo, project, buildMeshes, updateCamera, sel,
  forceFull: () => { needMesh = true; }, dirtyOne: () => markDirty(20, 0, 20) }; // для отладки и тестов
</script>
